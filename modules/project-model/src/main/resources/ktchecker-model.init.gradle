                    def pluginData = pluginDataCapture?.value
                    def pluginFiles = capture('compiler_arguments_unmodeled', id, 'compiler-plugin-files') {
                        KtCheckerPinnedModelApi.effectivePluginFiles(task, pluginData)
                    }
                    def plugins = []
                    if (fullArguments != null) {
                        def pluginPaths = capture('compiler_arguments_unmodeled', id, 'compiler-plugin-argument-paths') {
                            KtCheckerPinnedModelApi.pathArray(known(fullArguments.value, 'getPluginClasspaths'))
                        }
                        if (pluginPaths != null) {
                            plugins = pluginPaths.collect { artifact(new File(it), 'compiler-plugin:' + new File(it).name, id) }
                            if (pluginFiles != null) capture('compiler_arguments_unmodeled', id, 'compiler-plugin-argument-roles') {
                                KtCheckerPinnedModelApi.samePaths(pluginPaths, pluginFiles)
                            }
                        } else if (pluginFiles != null) plugins = pluginFiles.collect { artifact(it, 'compiler-plugin:' + it.name, id) }
                    } else if (pluginFiles != null) {
                        // Independently observed task files only; the all-type failure above
                        // remains a gap, so this ordering is not an effective argv attestation.
                        plugins = pluginFiles.collect { artifact(it, 'compiler-plugin:' + it.name, id) }
                    }
                    if (!plugins.isEmpty()) issue('compiler_arguments_unmodeled', id,
                        'compiler-plugin-provenance: nonempty plugin operands are retained; complete plugin properties/output roles require a separately qualified typed model')
                    if (pluginData != null) capture('compiler_arguments_unmodeled', id, 'compiler-plugin-input-state') {
                        def state = known(pluginData, 'getInputsOutputsState')
                        known(state, 'getInputFiles').toList().each { input ->
                            if (input.toPath().toAbsolutePath().normalize().startsWith(rootPath)) auxiliaryFiles += capturedTree([input], id)
                            else auxiliaryArtifacts << artifact(input, 'compiler-plugin-input:' + input.name, id)
                        }
                        if (!known(state, 'getInputs').isEmpty() || !known(state, 'getOutputFiles').isEmpty()) issue('compiler_arguments_unmodeled', id,
                            'compiler-plugin-properties-and-outputs: generated/plugin scalar derivation roles are outside this model vocabulary')
                    }
                    if (target.platformType.toString() == 'jvm') capture('compiler_arguments_unmodeled', id, 'compilation-java-inputs') {
                        auxiliaryFiles += capturedTree(known(task, 'getJavaSources').files.toList(), id)
                    }
                    if (target.platformType.toString() == 'jvm') capture('compiler_arguments_unmodeled', id, 'compilation-script-inputs') {
                        auxiliaryFiles += capturedTree(known(task, 'getScriptSources$kotlin_gradle_plugin_common').files.toList(), id)
                    }
                    def emptyPluginDomain = null
                    if (target.platformType.toString() == 'jvm' && fullArguments != null && pluginDataCapture != null && pluginFiles != null) {
                        emptyPluginDomain = capture('compiler_arguments_unmodeled', id, 'compiler-jvm-empty-plugin-domain') {
                            KtCheckerPinnedModelApi.emptyJvmPluginDomain(task, fullArguments, pluginDataCapture, pluginFiles)
                        }
                    }
                    if (pluginDataCapture != null && pluginDataCapture.state != 'available' && emptyPluginDomain == null) {
                        issue('compiler_arguments_unmodeled', id, 'compiler-plugin-data-' + pluginDataCapture.state +
                            ': nullable pinned plugin metadata is absent without a verified empty actual plugin/input/output/script domain')
                    }
                    if (compiler != null || selectedJdk != null || pluginFiles != null) toolchain = [kind: target.platformType.toString(),
                        compilerVersion: compiler?.version, compilerArtifacts: compiler?.artifacts ?: [],
                        runtimeArtifacts: selectedJdk?.artifacts ?: [], compilerPlugins: plugins]
                    try {
                        def declaredCompilerFiles = task.libraries.files.toList()
                        // Preserve ALL declared task entries, including absent/generated/tree
                        // outputs. The pinned builder filters missing files for its argv; that
                        // is not proof of authenticated NO-SOURCE absence or new artifact origin.
                        cp = declaredCompilerFiles.collect { artifact(it, 'resolved:' + it.name, id) }
                        if (fullArguments != null && target.platformType.toString() == 'jvm') capture('compiler_arguments_unmodeled', id, 'compiler-classpath-argument-roles') {
                            def actual = known(fullArguments.value, 'getClasspath')
                            def expected = declaredCompilerFiles.findAll { it.exists() }.collect { it.absolutePath }.join(File.pathSeparator)
                            if ((actual != null && !(actual instanceof String)) || (actual == null ? !expected.isEmpty() : actual != expected)) {
                                throw new IllegalStateException('Exact declared/effective classpath roles differ')
                            }
                        }
                    }
                    catch (Exception error) {
                        try { cp = c.compileDependencyFiles.files.toList().collect { artifact(it, 'resolved:' + it.name, id) } }
                        catch (Exception ignored) { issue('dependency_resolution_failed', id, 'Actual ordered compiler classpath is unavailable.') }
                        issue('compile_classpath_membership_unmodeled', id, error.class.simpleName + ': actual compiler classpath vocabulary unavailable')
                    }
                    def language = null
                    def api = null
                    capture('compiler_options_unavailable', id, 'compiler-language-version') { language = task.compilerOptions.languageVersion.orNull?.version }
                    capture('compiler_options_unavailable', id, 'compiler-api-version') { api = task.compilerOptions.apiVersion.orNull?.version }
                    def associated = []
                    try { associated = c.allAssociatedCompilations.collect { a -> "${a.project.path}|${a.target.name}|${a.name}".toString() }.sort() }
                    catch (Exception error) { issue('associated_compilations_unavailable', id, error.class.simpleName + ': actual friend/association graph unavailable') }
                    if (!associated.isEmpty() && friends.isEmpty()) issue('compiler_arguments_unmodeled', id,
                        'compiler-associated-friend-inputs: associated compilations are retained but no immutable friend-output bytes were established')
                    def jvmArgumentRoles = null
                    if (target.platformType.toString() == 'jvm' && fullArguments != null && selectedJdk != null && emptyPluginDomain != null) {
                        jvmArgumentRoles = capture('compiler_arguments_unmodeled', id, 'compiler-original-jvm-argument-roles') {
                            KtCheckerPinnedModelApi.originalJvmArgumentRoles(task, fullArguments, rootPath, selectedJdk.home,
                                actualFiles, cp, emptyPluginDomain)
                        }
                    }
                    def fact = [id: id, moduleId: p.path, target: target.name, platform: target.platformType.toString(), name: c.name,
                        defaultSourceSetId: "${p.path}|${c.defaultSourceSet.name}".toString(), sourceSetIds: members, sourceFiles: actualFiles,
                        compileTaskPath: task != null ? task.path : "${p.path}:<unavailable-${target.name}-${c.name}>".toString(),
                        dependencyConfiguration: c.compileDependencyConfigurationName, classpath: cp, projectDependencies: [],
                        toolchain: toolchain, compilerArguments: args, languageVersion: language, apiVersion: api,
                        friendArtifacts: friends, producedVariants: [], associatedCompilationIds: associated,
                        auxiliaryInputFiles: auxiliaryFiles.unique { it.path }.sort { it.path }, auxiliaryArtifacts: auxiliaryArtifacts,
                        jvmArgumentRoles: jvmArgumentRoles]
                    compilations << fact
                    compilationObjects << [project: p, target: target, compilation: c, task: task, fact: fact]
                }
            }
            // Corroborate ACTUAL Kotlin + same-compilation Java compiler boundaries
            // with ACTUAL original Kotlin usage compilation/configuration metadata.
            // A target, variant, configuration or compiler task name never guesses main.
            def producerApis = []
            def compilerOwners = []
            def usageRecords = []
            // Retain failed views until the index pins their ProjectState owners.
            // A List cannot silently discard an equality-colliding failed view.
            def unavailableProducerProjects = []
            boolean producerVocabularyComplete = true
            targetObjects.each { targetEntry ->
                def p = targetEntry.project
                def target = targetEntry.target
                def api = capture('produced_variants_unavailable', p.path, 'outgoing-producer-api') {
                    KtCheckerPinnedModelApi.producerApi(target)
                }
                if (api == null) {
                    producerVocabularyComplete = false
                    unavailableProducerProjects.add(p)
                    return
                }
                producerApis.add(api)
                def usages = capture('produced_variants_unavailable', p.path, 'outgoing-kotlin-usage-metadata') {
                    KtCheckerPinnedModelApi.kotlinUsages(api, p, target)
                }
                if (usages == null) unavailableProducerProjects.add(p)
                else usageRecords.addAll(usages)
                compilationObjects.findAll { it.target.is(target) }.each { entry ->
                    def tasks = capture('produced_variants_unavailable', entry.fact.id, 'outgoing-compilation-compiler-owners') {
                        KtCheckerPinnedModelApi.at('outgoing-compilation-project-owner') {
                            if (!KtCheckerPinnedModelApi.projectOwner(api.projectOwnerApi, entry.project).is(
                                KtCheckerPinnedModelApi.projectOwner(api.projectOwnerApi, p))) {
                                throw new IllegalStateException('Missing actual compilation project owner identity')
                            }
                        }
                        KtCheckerPinnedModelApi.compilerTasks(api, p, target, entry.compilation, entry.task)
                    }
                    if (tasks == null) unavailableProducerProjects.add(p)
                    else compilerOwners.add([project: p, compilation: entry.compilation, id: entry.fact.id, tasks: tasks])
                }
            }
            def producerIndex = null
            if (producerVocabularyComplete && !producerApis.isEmpty()) producerIndex = capture('produced_variants_unavailable', null, 'outgoing-producer-index') {
                if (producerApis.any { !it.taskType.is(producerApis[0].taskType) }) throw new IllegalStateException('Mixed actual Gradle task type identity')
                def ownerApi = producerApis[0].projectOwnerApi
                KtCheckerPinnedModelApi.at('outgoing-project-owner-api') {
                    if (producerApis.any { !it.projectOwnerApi.projectType.is(ownerApi.projectType) ||
                        !it.projectOwnerApi.internalProjectType.is(ownerApi.internalProjectType) ||
                        !it.projectOwnerApi.projectStateType.is(ownerApi.projectStateType) }) {
                        throw new IllegalStateException('Mixed actual Gradle project owner type identity')
                    }
                }
                def index = new KtCheckerModelProducerIndex(producerApis[0].taskType,
                    producerApis.collectMany { [it.kotlinCompilerType, it.abstractCompilerType] }.unique(), ownerApi)
                unavailableProducerProjects.each { index.markUnavailable(it) }
                compilerOwners.each { owner -> index.register(owner.project, owner.compilation, owner.id, owner.tasks) }
                index
            }
            def outgoing = []
            root.allprojects.toList().sort { it.path }.each { p ->
                p.configurations.findAll { it.canBeConsumed }.sort { it.name }.each { conf ->
                    def record = { String name, attrs, Collection artifacts ->
                        try {
                            if (artifacts.size() > KtCheckerModelProducerIndex.TASK_LIMIT) throw new IllegalStateException('Outgoing artifact bound exceeded')
                            def files = artifacts.collect { it.file.canonicalPath }.sort()
                            if (files.isEmpty()) return
                            def seeds = []
                            artifacts.each { published ->
                                def tasks = published.buildDependencies.getDependencies(null)
                                if (!(tasks instanceof Collection) || tasks.size() > KtCheckerModelProducerIndex.TASK_LIMIT - seeds.size()) {
                                    throw new IllegalStateException('Outgoing seed task bound exceeded')
                                }
                                seeds.addAll(tasks)
                            }
                            def producer = producerIndex != null ?
                                producerIndex.resolve(p, conf.name, seeds, usageRecords, { task -> task.taskDependencies.getDependencies(task) }) :
                                [state: 'producer_or_usage_vocabulary_unavailable', compilationId: null, producerIds: []]
                            if (producer.state == 'unique') {
                                outgoing << [moduleId: p.path, name: name, configurationName: conf.name,
                                    attrs: attributes(attrs), files: files, artifactTypes: artifacts.collect { it.type },
                                    compilation: producer.compilation, compilationId: producer.compilationId]
                            } else {
                                issue('produced_variants_unavailable', p.path, 'configuration=' + conf.name + ', outgoing=' + name +
                                    ', state=' + producer.state + ', producerIds=' + producer.producerIds.join(',') +
                                    ', taskCount=' + producer.taskCount + ', edgeCount=' + producer.edgeCount +
                                    ': no corroborated unique same-module compiler producer')
                            }
                        } catch (KtCheckerModelCaptureFailure error) { issue('produced_variants_unavailable', p.path,
                            error.stage + ': ' + error.failureKind + ': outgoing artifact producer association unavailable')
                        } catch (Exception error) { issue('produced_variants_unavailable', p.path,
                            'configuration=' + conf.name + ', outgoing=' + name + ', ' + error.class.simpleName + ': outgoing artifact producer association unavailable') }
                    }
                    record(conf.name, conf.attributes, conf.outgoing.artifacts)
                    conf.outgoing.variants.toList().sort { it.name }.each { variant -> record(variant.name, variant.attributes, variant.artifacts) }
                }
            }
            compilationObjects.each { entry ->
                def p = entry.project
                def fact = entry.fact
                try {
                    def conf = p.configurations.getByName(fact.dependencyConfiguration)
                    def resolvedArtifacts = conf.incoming.artifacts.artifacts.toList()
                    def resolutionRoot = conf.incoming.resolutionResult.rootComponent.get()
                    def rootBuildPath = capture('dependency_resolution_failed', fact.id, 'resolution-root-build-identity') {
                        KtCheckerPinnedModelApi.projectBuildPath(resolutionRoot.id,
                            org.gradle.api.artifacts.component.ProjectComponentIdentifier,
                            org.gradle.api.artifacts.component.BuildIdentifier)
                    }
                    // A root ProjectComponentIdentifier and its actual nonempty buildPath are
                    // mandatory. Never default an unknown identity to ':' or compare projectPath.
                    if (rootBuildPath == null) return
                    // These are DIRECT root dependencies. Transitive closure is an explicit owner policy.
                    resolutionRoot.dependencies.each { dependency ->
                        if (dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                            issue('dependency_resolution_failed', fact.id, dependency.attempted.displayName)
                        } else if (dependency.selected.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
                            def selected = dependency.selected.id
                            def selectedBuildPath = capture('dependency_resolution_failed', fact.id, 'selected-project-build-identity') {
                                KtCheckerPinnedModelApi.projectBuildPath(selected,
                                    org.gradle.api.artifacts.component.ProjectComponentIdentifier,
                                    org.gradle.api.artifacts.component.BuildIdentifier)
                            }
                            if (selectedBuildPath == null) return
                            if (selectedBuildPath != rootBuildPath) {
                                issue('included_project_dependency_unmodeled', fact.id, 'Resolved composite project is outside this root-build vocabulary.')
                            } else {
                                def variant = dependency.resolvedVariant
                                def attrs = attributes(variant.attributes)
                                def componentArtifacts = resolvedArtifacts.findAll { a -> a.id.componentIdentifier == selected }.collect { a ->
                                    [componentId: a.id.componentIdentifier, attrs: attributes(a.variant.attributes), file: a.file.canonicalPath]
                                }
                                def association = KtCheckerPinnedModelApi.matchOutgoingProducer(selected, selected.projectPath, attrs, componentArtifacts, outgoing)
                                def producer = association.compilationId
                                if (producer != null) {
                                    def record = compilations.find { it.id == producer }
                                    record.producedVariants = (record.producedVariants + [variant.displayName]).unique().sort()
                                } else {
                                    issue('produced_variants_unavailable', fact.id, 'selectedVariant=' + variant.displayName + ', state=' + association.state +
                                        ', candidateCount=' + association.candidateCount + ': exact selected component/artifact association unavailable')
                                }
                                fact.projectDependencies << [moduleId: selected.projectPath, selectedVariant: variant.displayName,
                                    variantAttributes: attrs, compilationId: producer]
                            }
                        }
                    }
                    fact.projectDependencies = fact.projectDependencies.unique()
                } catch (Exception error) { issue('dependency_resolution_failed', fact.id, error.class.simpleName + ': complete resolved direct variant graph unavailable') }
            }
            root.fileTree(root.projectDir) {
                exclude '**/.gradle/**', '**/.git/**', '**/build/**'
                include '**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/*.toml', '**/gradle-wrapper.properties', '**/dependency-locks/**', 'buildSrc/**'
            }.files.toList().sort { it.absolutePath }.each { file ->
                def fact = sourceFile(file, null)
                if (fact != null) configuration[fact.path] = fact
            }
            root.allprojects.each { p ->
                try { p.buildscript.configurations.findByName('classpath')?.files?.toList()?.each {
                    buildscript << artifact(it, 'buildscript:' + it.name, p.path)
                } } catch (Exception error) { issue('buildscript_resolution_failed', p.path, error.class.simpleName + ': buildscript identity unavailable') }
            }
            // External settings/init scripts are independent pinned inputs, not ignored worktree files.
            ([new File(gradle.gradleUserHomeDir, 'gradle.properties')] + gradle.startParameter.allInitScripts).unique().each { file ->
                if (file.isFile()) externalConfiguration << artifact(file, 'gradle-external-config:' + file.name, null)
            }
            if (root.file('buildSrc').exists()) issue('build_source_graph_unmodeled', null, 'buildSrc source/executable graph needs its own coherent owner import.')
            def included = gradle.includedBuilds.collect { it.name }.sort()
            def document = [schemaVersion: 1, exporterId: 'ktchecker-gradle-kmp-model/1', gradleVersion: gradle.gradleVersion,
                modules: modules, sourceSets: sourceSets, compilations: compilations,
                configurationInputs: configuration.values().toList().sort { it.path }, generatedInputs: generatedByTask.values().toList().sort { it.taskPath },
                buildscriptArtifacts: buildscript.unique { it.path }, includedBuilds: included, issues: issues.unique(),
                externalConfigurationArtifacts: externalConfiguration.unique { it.path }]
            def selected = root.findProperty('ktcheckerModelOutput')
            if (selected == null) throw new GradleException('Owner-selected isolated ktcheckerModelOutput is required')
            def destination = new File(selected.toString())
            destination.parentFile.mkdirs()
            destination.setText(JsonOutput.toJson(document), 'UTF-8')
        }
    }
}
