// BEGIN KTCHECKER_PINNED_MODEL_API
// Kept self-contained so public-getter/signature tests can exercise this exact code
// without configuring a project or launching Gradle. These helpers confer no authority.
class KtCheckerModelCaptureFailure extends IllegalStateException {
    final String stage
    final String failureKind

    KtCheckerModelCaptureFailure(String stage, Throwable cause) {
        super(stage + ': ' + cause.getClass().getSimpleName(), cause)
        this.stage = stage
        this.failureKind = cause.getClass().getSimpleName()
    }
}

// Identity-only ownership. A compiler's prerequisites are inputs, not additional
// producers of the enclosing artifact. Unknown/foreign compilers must terminate
// the walk too; they cannot be traversed until a convenient local owner is found.
class KtCheckerModelProducerIndex {
    static final int TASK_LIMIT = 4096
    static final int EDGE_LIMIT = 16384
    private final Class taskType
    private final List<Class> compilerTypes
    private final Map projectOwnerApi
    private final Map byTask = new IdentityHashMap()
    private final Map byCompilation = new IdentityHashMap()
    private final Set unavailableProjectOwners = Collections.newSetFromMap(new IdentityHashMap())
    private boolean projectOwnersComplete = true

    KtCheckerModelProducerIndex(Class taskType, Collection compilerTypes, Map projectOwnerApi) {
        if (taskType == null || compilerTypes == null || compilerTypes.isEmpty() || compilerTypes.size() > 128 ||
            compilerTypes.any { !(it instanceof Class) } || projectOwnerApi == null) {
            throw new IllegalStateException('Unavailable compiler task vocabulary')
        }
        this.taskType = taskType
        this.compilerTypes = new ArrayList<Class>(compilerTypes)
        this.projectOwnerApi = new LinkedHashMap(projectOwnerApi)
    }

    void markUnavailable(Object project) {
        try {
            unavailableProjectOwners.add(KtCheckerPinnedModelApi.projectOwner(projectOwnerApi, project))
        } catch (KtCheckerModelCaptureFailure error) {
            // An unkeyable failed view cannot disappear on a later enumeration.
            // The caller discards a failed index too; never repair this instance.
            projectOwnersComplete = false
            throw error
        }
    }

    void register(Object project, Object compilation, String id, Collection tasks) {
        if (project == null || compilation == null || id == null || id.isBlank() || id.length() > 4096 ||
            tasks == null || tasks.isEmpty() || tasks.size() > 2) throw new IllegalStateException('Unavailable actual compiler owner')
        def ownerState = KtCheckerPinnedModelApi.projectOwner(projectOwnerApi, project)
        def owner = byCompilation.get(compilation)
        KtCheckerPinnedModelApi.at('outgoing-index-compilation-owner') {
            if (owner != null && (!owner.projectOwner.is(ownerState) || owner.id != id)) {
                throw new IllegalStateException('Inconsistent actual compilation owner')
            }
        }
        if (owner == null) {
            if (byCompilation.size() >= TASK_LIMIT) throw new IllegalStateException('Compiler owner bound exceeded')
            owner = [projectOwner: ownerState, compilation: compilation, id: id]
            byCompilation.put(compilation, owner)
        }
        tasks.each { task ->
            KtCheckerPinnedModelApi.at('outgoing-index-task-owner') {
                if (!taskType.isInstance(task) || !compilerTypes.any { it.isInstance(task) } ||
                    !KtCheckerPinnedModelApi.projectOwner(projectOwnerApi, taskType.getMethod('getProject').invoke(task)).is(ownerState)) {
                    throw new IllegalStateException('Compiler task is not owned by the actual compilation project')
                }
            }
            def owners = byTask.get(task)
            if (owners == null) { owners = []; byTask.put(task, owners) }
            // Distinct actual compilations remain distinct even if names/IDs collide.
            if (!owners.any { it.compilation.is(compilation) }) owners.add(owner)
        }
    }

    Map resolve(Object project, String configurationName, Collection seeds, Collection usages, Closure dependencies) {
        if (project == null || configurationName == null || configurationName.isBlank() || seeds == null ||
            seeds.size() > TASK_LIMIT || usages == null || usages.size() > TASK_LIMIT || dependencies == null) {
            throw new IllegalStateException('Unavailable bounded outgoing producer inputs')
        }
        def ownerState = projectOwnersComplete ? KtCheckerPinnedModelApi.projectOwner(projectOwnerApi, project) : null
        if (!projectOwnersComplete || unavailableProjectOwners.contains(ownerState)) {
            // Check the canonical owner BEFORE any task walk, not the ephemeral
            // Project view returned by this particular allprojects enumeration.
            return [state: 'producer_or_usage_vocabulary_unavailable', compilationId: null, compilation: null,
                producerCount: 0, producerIds: [], unknownCompilerCount: 0, usageCount: 0, taskCount: 0, edgeCount: 0]
        }
        def scheduled = Collections.newSetFromMap(new IdentityHashMap())
        def queue = new ArrayDeque()
        def schedule = { task ->
            if (!taskType.isInstance(task)) throw new IllegalStateException('Unknown artifact build-dependency vocabulary')
            if (scheduled.add(task)) {
                if (scheduled.size() > TASK_LIMIT) throw new IllegalStateException('Producer task bound exceeded')
                queue.addLast(task)
            }
        }
        seeds.each { schedule(it) }
        def found = new IdentityHashMap()
        int edges = seeds.size()
        int unknownCompilers = 0
        while (!queue.isEmpty()) {
            def task = queue.removeFirst()
            def owners = byTask.get(task)
            if (owners != null) {
                owners.each { found.put(it.compilation, it) }
                continue
            }
            if (compilerTypes.any { it.isInstance(task) }) {
                unknownCompilers++
                continue
            }
            def prerequisites = dependencies.call(task)
            if (!(prerequisites instanceof Collection) || prerequisites.size() > EDGE_LIMIT - edges) {
                throw new IllegalStateException('Producer edge bound exceeded')
            }
            edges += prerequisites.size()
            prerequisites.each { schedule(it) }
        }
        def usageCompilations = Collections.newSetFromMap(new IdentityHashMap())
        boolean unknownUsage = false
        usages.each { usage ->
            if (!(usage instanceof Map) || usage.project == null || usage.compilation == null ||
                !(usage.configurationName instanceof String)) throw new IllegalStateException('Unknown actual Kotlin usage vocabulary')
            if (KtCheckerPinnedModelApi.projectOwner(projectOwnerApi, usage.project).is(ownerState) && usage.configurationName == configurationName) {
                usageCompilations.add(usage.compilation)
                def registered = byCompilation.get(usage.compilation)
                if (registered == null || !registered.projectOwner.is(ownerState)) unknownUsage = true
            }
        }
        def result = [compilationId: null, compilation: null, producerCount: found.size(),
            producerIds: found.values().collect { it.id }.unique().sort(), unknownCompilerCount: unknownCompilers,
            usageCount: usageCompilations.size(), taskCount: scheduled.size(), edgeCount: edges]
        String state
        if (found.size() > 1) state = 'ambiguous_task_producers'
        else if (unknownCompilers > 0) state = 'unowned_compiler'
        else if (found.isEmpty()) state = 'producer_unknown'
        else {
            def owner = found.values().iterator().next()
            if (!owner.projectOwner.is(ownerState)) state = 'foreign_compiler_producer'
            else if (unknownUsage) state = 'usage_compilation_unregistered'
            else if (usageCompilations.isEmpty()) state = 'usage_unknown'
            else if (usageCompilations.size() > 1) state = 'ambiguous_usage_compilations'
            else if (!usageCompilations.iterator().next().is(owner.compilation)) state = 'usage_producer_mismatch'
            else {
                state = 'unique'
                result.compilationId = owner.id
                result.compilation = owner.compilation
            }
        }
        result + [state: state]
    }
}

class KtCheckerPinnedModelApi {
    static Object at(String stage, Closure operation) {
        try { return operation.call() }
        catch (KtCheckerModelCaptureFailure error) { throw error }
        catch (Exception error) {
            Throwable cause = error
            int depth = 0
            while ((cause instanceof java.lang.reflect.InvocationTargetException ||
                cause instanceof java.lang.reflect.UndeclaredThrowableException ||
                cause instanceof org.codehaus.groovy.runtime.InvokerInvocationException) && cause.getCause() != null && depth++ < 16) cause = cause.getCause()
            if (cause instanceof KtCheckerModelCaptureFailure) throw cause
            if (cause instanceof VirtualMachineError || cause instanceof ThreadDeath) throw cause
            throw new KtCheckerModelCaptureFailure(stage, cause)
        } catch (LinkageError error) { throw new KtCheckerModelCaptureFailure(stage, error) }
    }

    static Object getter(Object instance, String name) {
        if (instance == null) throw new IllegalStateException('Missing instance for pinned getter ' + name)
        instance.getClass().getMethod(name).invoke(instance)
    }

    static List<String> strings(Object value) {
        if (!(value instanceof List) || value.size() > 16384 || value.any {
            !(it instanceof String) || it.length() > 8192 || it.indexOf('\u0000') >= 0
        }) throw new IllegalStateException('Unavailable bounded exact string-vector vocabulary')
        new ArrayList<String>(value)
    }

    static List<String> pathArray(Object value) {
        // A successfully created arguments object's null field means no such operand.
        // It does not establish that a missing plugin/friend provider was verified empty.
        if (value == null) return []
        if (!(value instanceof String[])) throw new IllegalStateException('Unsupported pinned path-array vocabulary')
        strings(Arrays.asList((String[]) value))
    }

    static Map fullCompilerArguments(Object task) {
        def api = at('compiler-api-load') {
            if (task == null || task.getClass().getClassLoader() == null) throw new IllegalStateException('Missing pinned task loader')
            // Resolve ONLY through this actual task/plugin loader. No context/root/system
            // loader retries, guessed overloads, deprecated setup flags, or ignored errors.
            def loader = task.getClass().getClassLoader()
            def producer = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer')
            def context = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer$CreateCompilerArgumentsContext')
            def argumentType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer$ArgumentType')
            def toolArguments = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.CommonToolArguments')
            def factoryType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducerKt')
            def serializerType = loader.loadClass('org.jetbrains.kotlin.compilerRunner.ArgumentUtils')
            if (!producer.isInterface() || !producer.isInstance(task) || !argumentType.isEnum()) {
                throw new IllegalStateException('Unsupported pinned compiler producer/type identity')
            }
            def types = argumentType.getEnumConstants().toList()
            if (types.collect { it.name() } != ['Primitive', 'PluginClasspath', 'DependencyClasspath', 'Sources']) {
                throw new IllegalStateException('Unsupported pinned complete argument-type domain')
            }
            def factory = factoryType.getMethod('CreateCompilerArgumentsContext', Set.class, Boolean.TYPE)
            def create = producer.getMethod('createCompilerArguments', context)
            def serialize = serializerType.getMethod('convertArgumentsToStringList', toolArguments)
            if (!java.lang.reflect.Modifier.isStatic(factory.modifiers) || factory.returnType != context ||
                create.returnType != toolArguments || !java.lang.reflect.Modifier.isStatic(serialize.modifiers) ||
                !List.class.isAssignableFrom(serialize.returnType)) {
                throw new IllegalStateException('Unsupported pinned compiler method signatures')
            }
            [factory: factory, create: create, serialize: serialize, types: new LinkedHashSet(types),
                contextType: context, argumentsType: toolArguments]
        }
        def context = at('compiler-arguments-context') {
            def value = api.factory.invoke(null, api.types, false)
            if (!api.contextType.isInstance(value)) throw new IllegalStateException('Missing exact compiler argument context')
            value
        }
        def value = at('compiler-arguments-create') {
            def arguments = api.create.invoke(task, context)
            if (!api.argumentsType.isInstance(arguments)) throw new IllegalStateException('Missing exact compiler arguments object')
            arguments
        }
        def arguments = at('compiler-arguments-serialize') { strings(api.serialize.invoke(null, value)) }
        // Intended full task-configuration serialization at the exporter lifecycle point,
        // NOT evidence that this compiler task or a compiler child process actually ran.
        [value: value, arguments: arguments]
    }

    static Object optionalPluginData(Object task) {
        def provider = at('compiler-plugin-data-provider') { getter(task, 'getKotlinPluginData$kotlin_gradle_plugin_common') }
        if (provider == null) return [state: 'provider_absent', value: null]
        def value = at('compiler-plugin-data-value') { getter(provider, 'getOrNull') }
        [state: value == null ? 'value_absent' : 'available', value: value]
    }

    static List<File> effectivePluginFiles(Object task, Object pluginData) {
        def files = getter(task, 'getPluginClasspath')
        if (files == null) throw new IllegalStateException('Missing default compiler plugin classpath')
        // The pinned KGP composes FileCollections in this order. Do not sort, flatten
        // into an inferred union, or discard the default scripting compiler plugins.
        if (pluginData != null) files = files.plus(getter(pluginData, 'getClasspath'))
        def result = files.toList()
        if (result.any { !(it instanceof File) }) throw new IllegalStateException('Unsupported compiler plugin file vocabulary')
        result
    }

    static void samePaths(List<String> operands, List<File> files) {
        if (operands != files.collect { it.absolutePath }) throw new IllegalStateException('Exact ordered task/argument path roles differ')
    }

    static Map ordinaryJvmProducer(Object task, Object fullCapture) {
        at('compiler-jvm-original-producer') {
            if (task == null || task.getClass().getClassLoader() == null || !(fullCapture instanceof Map)) {
                throw new IllegalStateException('Missing original JVM producer capture')
            }
            // The registered owner runtime supplies the byte pins. A class name alone is
            // NOT origin authority. These checks additionally reject custom dispatch and
            // argument-object implementations for the reviewed KGP lowering semantics.
            def loader = task.getClass().getClassLoader()
            def taskType = loader.loadClass('org.jetbrains.kotlin.gradle.tasks.KotlinCompile')
            def baseType = loader.loadClass('org.jetbrains.kotlin.gradle.tasks.AbstractKotlinCompile')
            def contextType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer$CreateCompilerArgumentsContext')
            def argumentsType = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.K2JVMCompilerArguments')
            def commonArgumentsType = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.CommonCompilerArguments')
            def toolArgumentsType = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.CommonToolArguments')
            def changesType = loader.loadClass('org.gradle.work.InputChanges')
            def backupType = loader.loadClass('org.jetbrains.kotlin.gradle.tasks.TaskOutputsBackup')
            def providerType = loader.loadClass('org.gradle.api.provider.Provider')
            if (!taskType.isInstance(task) || fullCapture.value == null || !fullCapture.value.getClass().is(argumentsType)) {
                throw new IllegalStateException('Unsupported ordinary JVM producer/argument object')
            }
            def creates = task.getClass().getMethods().findAll { method ->
                method.name == 'createCompilerArguments' && method.parameterTypes.toList() == [contextType]
            }
            def lowers = task.getClass().getMethods().findAll { method ->
                method.name == 'callCompilerAsync$kotlin_gradle_plugin_common' && method.parameterCount == 3 &&
                    method.parameterTypes[1].is(changesType) && method.parameterTypes[2].is(backupType)
            }
            if (creates.size() != 2 || creates.collect { it.returnType }.toSet() != [argumentsType, toolArgumentsType].toSet() ||
                lowers.size() != 2 || lowers.collect { it.parameterTypes[0] }.toSet() != [argumentsType, commonArgumentsType].toSet() ||
                (creates + lowers).any { method -> !method.declaringClass.is(taskType) ||
                    java.lang.reflect.Modifier.isStatic(method.modifiers) || java.lang.reflect.Modifier.isAbstract(method.modifiers) } ||
                lowers.any { !it.returnType.is(Void.TYPE) }) {
                throw new IllegalStateException('Custom or unavailable pinned JVM producer/lowering dispatch')
            }
            def pluginGetter = task.getClass().getMethod('getKotlinPluginData$kotlin_gradle_plugin_common')
            if (!pluginGetter.declaringClass.is(baseType) || !pluginGetter.returnType.is(providerType) ||
                !java.lang.reflect.Modifier.isFinal(pluginGetter.modifiers)) {
                throw new IllegalStateException('Unknown nullable plugin metadata producer')
            }
            [taskType: taskType, argumentsType: argumentsType,
                pluginConfigType: loader.loadClass('org.jetbrains.kotlin.gradle.plugin.CompilerPluginConfig'),
                pluginOptionsType: loader.loadClass('org.jetbrains.kotlin.gradle.tasks.CompilerPluginOptions'),
                pluginDataType: loader.loadClass('org.jetbrains.kotlin.gradle.tasks.KotlinCompilerPluginData'),
                pluginStateType: loader.loadClass('org.jetbrains.kotlin.gradle.tasks.KotlinCompilerPluginData$InputsOutputsState')]
        }
    }

    static List<File> originalFiles(Object collection) {
        def files = getter(collection, 'getFiles')
        if (!(files instanceof Set) || files.size() > 16384 || files.any { !(it instanceof File) }) {
            throw new IllegalStateException('Unavailable exact bounded Gradle file collection')
        }
        new ArrayList<File>(files)
    }

    static void requireEmptyPluginOptions(Object options, Map api) {
        if (!api.pluginConfigType.isInstance(options)) throw new IllegalStateException('Unknown actual compiler plugin option configuration')
        // Base CompilerPluginConfig has allOptions(), NOT getArguments(). The pinned
        // producer folds these maps into CompilerPluginOptions without inventing entries.
        // Empty containers are allowed; a nonempty lazy option is never evaluated away.
        def getter = options.getClass().getMethod('allOptions')
        if (!getter.declaringClass.is(api.pluginConfigType) || !java.lang.reflect.Modifier.isFinal(getter.modifiers)) {
            throw new IllegalStateException('Unknown compiler plugin option producer')
        }
        def values = getter.invoke(options)
        if (!(values instanceof Map) || values.size() > 16384 || values.any { key, value ->
            !(key instanceof String) || key.length() > 8192 || !(value instanceof List) || !value.isEmpty()
        }) throw new IllegalStateException('Nonempty or unavailable compiler plugin options')
        if (api.pluginOptionsType.isInstance(options) && !strings(KtCheckerPinnedModelApi.getter(options, 'getArguments')).isEmpty()) {
            throw new IllegalStateException('Nonempty serialized compiler plugin options')
        }
    }

    static String emptyJvmPluginDomain(Object task, Object fullCapture, Object pluginCapture, Object effectiveFiles) {
        def api = ordinaryJvmProducer(task, fullCapture)
        if (!(pluginCapture instanceof Map) || !(effectiveFiles instanceof List) || !effectiveFiles.isEmpty() ||
            !(pluginCapture.state in ['provider_absent', 'value_absent', 'available']) ||
            ((pluginCapture.state == 'available') != (pluginCapture.value != null))) {
            throw new IllegalStateException('Missing independent empty plugin-domain observations')
        }
        def arguments = fullCapture.value
        ['getPluginClasspaths', 'getPluginOptions', 'getPluginConfigurations', 'getPluginOrderConstraints'].each { name ->
            if (!pathArray(getter(arguments, name)).isEmpty()) throw new IllegalStateException('Nonempty compiler plugin argument domain')
        }
        if (getter(arguments, 'getIntellijPluginRoot') != null || strings(fullCapture.arguments).any { token ->
            token.startsWith('@') || token == '-P' || token.startsWith('-P=') || token.startsWith('-Xplugin') ||
                token.startsWith('-Xcompiler-plugin') || token.startsWith('-Xintellij-plugin-root')
        }) throw new IllegalStateException('Plugin/response argument semantics are not an empty domain')
        def taskOptions = getter(getter(task, 'getPluginOptions'), 'get')
        if (!(taskOptions instanceof List) || taskOptions.size() > 16384) throw new IllegalStateException('Unavailable task plugin option domain')
        taskOptions.each { requireEmptyPluginOptions(it, api) }
        if (pluginCapture.value != null) {
            def data = pluginCapture.value
            if (!data.getClass().is(api.pluginDataType)) throw new IllegalStateException('Unknown actual compiler plugin metadata')
            requireEmptyPluginOptions(getter(data, 'getOptions'), api)
            def state = getter(data, 'getInputsOutputsState')
            if (state == null || !state.getClass().is(api.pluginStateType)) throw new IllegalStateException('Unknown actual plugin input/output vocabulary')
            def inputs = getter(state, 'getInputs')
            def inputFiles = getter(state, 'getInputFiles')
            def outputFiles = getter(state, 'getOutputFiles')
            if (!(inputs instanceof Map) || !inputs.isEmpty() || !(inputFiles instanceof Set) || !inputFiles.isEmpty() ||
                !(outputFiles instanceof Set) || !outputFiles.isEmpty()) {
                throw new IllegalStateException('Nonempty actual compiler plugin inputs/properties/outputs')
            }
        }
        if (!effectivePluginFiles(task, pluginCapture.value).isEmpty() || !originalFiles(getter(task, 'getJavaSources')).isEmpty()) {
            throw new IllegalStateException('Nonempty actual plugin or Java input domain')
        }
        def scripts = getter(task, 'getScriptSources$kotlin_gradle_plugin_common')
        if (!originalFiles(scripts).isEmpty() || !originalFiles(getter(scripts, 'getAsFileTree')).isEmpty() ||
            getter(getter(task, 'getMultiPlatformEnabled'), 'get') != Boolean.FALSE ||
            getter(arguments, 'getMultiPlatform') != Boolean.FALSE || getter(arguments, 'getScript') != Boolean.FALSE ||
            getter(arguments, 'getRepl') != Boolean.FALSE || getter(arguments, 'getExpression') != null ||
            getter(arguments, 'getBuildFile') != null || getter(arguments, 'getJavaPackagePrefix') != null ||
            getter(arguments, 'getUseFirLT') != Boolean.TRUE) {
            throw new IllegalStateException('Nonordinary script/Java/refinement/frontend domain')
        }
        ['getFriendPaths', 'getCommonSources', 'getFragments', 'getFragmentSources', 'getFragmentRefines',
            'getFragmentDependencies', 'getFragmentFriendDependencies', 'getFragmentIncrementalClasspath',
            'getJavaSourceRoots', 'getScriptTemplates', 'getScriptResolverEnvironment'].each { name ->
            if (!pathArray(getter(arguments, name)).isEmpty()) throw new IllegalStateException('Nonordinary source/input argument domain')
        }
        pluginCapture.state == 'available' ? 'available_empty' : pluginCapture.state
    }

    static Map originalJvmArgumentRoles(Object task, Object fullCapture, Object sourceRoot, Object selectedHome,
        Object sourceFiles, Object classpath, Object pluginDomain) {
        ordinaryJvmProducer(task, fullCapture)
        if (File.separator != '/' || File.pathSeparator != ':' || !(sourceRoot instanceof java.nio.file.Path) ||
            !(selectedHome instanceof String) || !(sourceFiles instanceof List) || !(classpath instanceof List) ||
            !(pluginDomain in ['provider_absent', 'value_absent', 'available_empty'])) {
            throw new IllegalStateException('Unavailable original POSIX JVM role domain')
        }
        def root = sourceRoot.toAbsolutePath().normalize()
        if (root != sourceRoot || root.toRealPath() != root) throw new IllegalStateException('Unaliased original snapshot root required')
        def arguments = fullCapture.value
        // The pinned Sources producer appends scripts + Java + Kotlin, with Kotlin in
        // this actual FileTree iteration order. Java/scripts were independently empty.
        def files = originalFiles(getter(getter(task, 'getSources'), 'getAsFileTree'))
        samePaths(strings(getter(arguments, 'getFreeArgs')), files)
        def paths = files.collect { file ->
            def path = file.toPath().toAbsolutePath().normalize()
            if (path.toString() != file.absolutePath || !path.startsWith(root) || path == root ||
                !file.name.endsWith('.kt') || !java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) ||
                path.toRealPath() != path) throw new IllegalStateException('Nonregular or aliased original Kotlin source')
            root.relativize(path).toString()
        }
        if (sourceFiles.any { !(it instanceof Map) || !(it.path instanceof String) } ||
            paths.size() != paths.toSet().size() || sourceFiles.collect { it.path }.size() != sourceFiles.collect { it.path }.toSet().size() ||
            paths.toSet() != sourceFiles.collect { it.path }.toSet()) {
            throw new IllegalStateException('Original source order is not a bijection of complete model membership')
        }
        def declared = originalFiles(getter(task, 'getLibraries'))
        def operand = getter(arguments, 'getClasspath')
        if ((operand != null && !(operand instanceof String)) || classpath.any { !(it instanceof Map) || !(it.path instanceof String) } ||
            classpath.collect { it.path } != declared.collect { it.absolutePath } || declared.any { file ->
                def path = file.toPath().toAbsolutePath().normalize()
                path.toString() != file.absolutePath || !java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) ||
                    path.toRealPath() != path
            } || (operand == null ? !declared.isEmpty() : operand != declared.collect { it.absolutePath }.join(File.pathSeparator))) {
            throw new IllegalStateException('Original full ordered classpath role differs from independently captured task files')
        }
        def destination = getter(arguments, 'getDestination')
        def directory = getter(getter(getter(task, 'getDestinationDirectory'), 'get'), 'getAsFile')
        def jdk = getter(arguments, 'getJdkHome')
        def selected = new File(selectedHome).toPath()
        if (!(destination instanceof String) || !(directory instanceof File) || destination != directory.absolutePath ||
            directory.toPath().toAbsolutePath().normalize().toString() != destination || directory.canonicalPath != destination ||
            !selected.isAbsolute() || selected.normalize() != selected || selected.toRealPath() != selected ||
            (jdk != null && (!(jdk instanceof String) || jdk != selectedHome))) {
            throw new IllegalStateException('Original destination/JDK task roles are not exact')
        }
        // This declares intended roles only. The importer separately requires registered
        // owner source/JDK/default-output provenance; output presence is NOT attestation.
        [schemaVersion: 1, adapterId: 'ktchecker/kgp-2.4.21-original-jvm-roles/1', compileTaskPath: getter(task, 'getPath'),
            sourcePaths: paths, classpathOperand: operand, destinationPath: destination,
            selectedJdkHome: selectedHome, jdkHomeOperand: jdk, pluginDataState: pluginDomain]
    }

    static Map projectOwnerApi(Object project) {
        at('outgoing-project-owner-api') {
            if (project == null || project.getClass().getClassLoader() == null) {
                throw new IllegalStateException('Missing actual project loader')
            }
            // Pin ONLY through this actual Project's loader, not the target,
            // helper, context or system loader. No implementation-class guess.
            def loader = project.getClass().getClassLoader()
            def projectType = loader.loadClass('org.gradle.api.Project')
            def internalProjectType = loader.loadClass('org.gradle.api.internal.project.ProjectInternal')
            def projectStateType = loader.loadClass('org.gradle.api.internal.project.ProjectState')
            if (!projectType.isInterface() || !internalProjectType.isInterface() || !projectStateType.isInterface() ||
                !projectType.isAssignableFrom(internalProjectType) || !internalProjectType.isInstance(project)) {
                throw new IllegalStateException('Unsupported pinned project owner type identity')
            }
            def ownerGetter = internalProjectType.getMethod('getOwner')
            if (java.lang.reflect.Modifier.isStatic(ownerGetter.modifiers) ||
                !ownerGetter.declaringClass.is(internalProjectType) || !ownerGetter.returnType.is(projectStateType)) {
                throw new IllegalStateException('Unsupported pinned project owner getter signature')
            }
            [projectType: projectType, internalProjectType: internalProjectType,
                projectStateType: projectStateType, ownerGetter: ownerGetter]
        }
    }

    static Object projectOwner(Map api, Object project) {
        at('outgoing-project-owner-value') {
            if (!api.internalProjectType.isInstance(project)) throw new IllegalStateException('Missing actual internal project view')
            def owner = api.ownerGetter.invoke(project)
            if (!api.projectStateType.isInstance(owner)) throw new IllegalStateException('Missing actual project owner state')
            // Gradle 9.6.1 can create fresh lifecycle/access Project views on
            // each allprojects enumeration. Their pinned getOwner delegates to
            // the same ProjectState. Retain views for operations, compare only
            // this owner's REFERENCE identity; never unwrap getMutableModel or
            // use getProject/equals/project paths as a canonicalization fallback.
            owner
        }
    }

    static Map producerApi(Object target) {
        if (target == null || target.getClass().getClassLoader() == null) throw new IllegalStateException('Missing actual Kotlin target loader')
        def loader = target.getClass().getClassLoader()
        // Original, public getters on the pinned implementation. Gradle adhoc
        // component wrappers do not preserve KotlinUsageContext compilation data.
        def targetType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.mpp.AbstractKotlinTarget')
        def targetInterface = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinTarget')
        def componentType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.mpp.InternalKotlinTargetComponent')
        def componentInterface = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinTargetComponent')
        def usageType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.mpp.KotlinUsageContext')
        def compilationType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilation')
        def withJavaType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.mpp.KotlinWithJavaCompilation')
        def kotlinCompilerType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer')
        def taskType = loader.loadClass('org.gradle.api.Task')
        def projectType = loader.loadClass('org.gradle.api.Project')
        def providerType = loader.loadClass('org.gradle.api.tasks.TaskProvider')
        def abstractCompilerType = loader.loadClass('org.gradle.api.tasks.compile.AbstractCompile')
        def javaCompilerType = loader.loadClass('org.gradle.api.tasks.compile.JavaCompile')
        if (!targetType.isInstance(target) || !targetInterface.isInstance(target) || !kotlinCompilerType.isInterface() ||
            !taskType.isAssignableFrom(abstractCompilerType) || !abstractCompilerType.isAssignableFrom(javaCompilerType)) {
            throw new IllegalStateException('Unsupported pinned producer type identity')
        }
        def api = [targetType: targetType, componentType: componentType, componentInterface: componentInterface,
            usageType: usageType, compilationType: compilationType, withJavaType: withJavaType,
            kotlinCompilerType: kotlinCompilerType, javaCompilerType: javaCompilerType, abstractCompilerType: abstractCompilerType,
            taskType: taskType, projectType: projectType, providerType: providerType,
            targetProject: targetType.getMethod('getProject'), components: targetType.getMethod('getKotlinComponents'),
            componentTarget: componentInterface.getMethod('getTarget'), usages: componentType.getMethod('getUsages'),
            usageCompilation: usageType.getMethod('getCompilation'), usageConfiguration: usageType.getMethod('getDependencyConfigurationName'),
            compilationTarget: compilationType.getMethod('getTarget'), compileKotlin: compilationType.getMethod('getCompileTaskProvider'),
            compileJava: withJavaType.getMethod('getCompileJavaTaskProvider'), providerGet: providerType.getMethod('get'),
            taskProject: taskType.getMethod('getProject')]
        [[api.targetProject, projectType], [api.components, Set.class], [api.componentTarget, targetInterface],
            [api.usages, Set.class], [api.usageCompilation, compilationType], [api.usageConfiguration, String.class],
            [api.compilationTarget, targetInterface], [api.compileKotlin, providerType], [api.compileJava, providerType],
            [api.providerGet, Object.class], [api.taskProject, projectType]].each { signature ->
            if (java.lang.reflect.Modifier.isStatic(signature[0].modifiers) || signature[0].returnType != signature[1]) {
                throw new IllegalStateException('Unsupported pinned producer getter signature')
            }
        }
        api.projectOwnerApi = at('outgoing-project-owner-api') {
            def ownerApi = projectOwnerApi(api.targetProject.invoke(target))
            if (!ownerApi.projectType.is(projectType)) throw new IllegalStateException('Mixed actual Gradle project type identity')
            ownerApi
        }
        api
    }

    static List compilerTasks(Map api, Object project, Object target, Object compilation, Object kotlinTask) {
        def ownerState = projectOwner(api.projectOwnerApi, project)
        at('outgoing-compilation-target-identity') {
            if (!api.targetType.isInstance(target) || !api.compilationType.isInstance(compilation) ||
                !api.compilationTarget.invoke(compilation).is(target)) {
                throw new IllegalStateException('Missing actual compilation target identity')
            }
        }
        at('outgoing-target-project-owner') {
            if (!projectOwner(api.projectOwnerApi, api.targetProject.invoke(target)).is(ownerState)) {
                throw new IllegalStateException('Missing actual target project owner identity')
            }
        }
        at('outgoing-kotlin-compiler-provider') {
            def kotlinProvider = api.compileKotlin.invoke(compilation)
            if (!api.providerType.isInstance(kotlinProvider) || !api.providerGet.invoke(kotlinProvider).is(kotlinTask) ||
                !api.taskType.isInstance(kotlinTask) || !api.kotlinCompilerType.isInstance(kotlinTask)) {
                throw new IllegalStateException('Missing actual Kotlin compiler provider identity')
            }
        }
        at('outgoing-kotlin-compiler-project-owner') {
            if (!projectOwner(api.projectOwnerApi, api.taskProject.invoke(kotlinTask)).is(ownerState)) {
                throw new IllegalStateException('Missing actual Kotlin compiler project owner identity')
            }
        }
        def tasks = [kotlinTask]
        if (api.withJavaType.isInstance(compilation)) {
            // This getter derives the task from THIS compilation's stored SourceSet.
            // Never synthesize compileJava/main task names or traverse Java inputs.
            def javaTask = at('outgoing-java-compiler-provider') {
                def provider = api.compileJava.invoke(compilation)
                if (!api.providerType.isInstance(provider)) throw new IllegalStateException('Missing actual Java compiler provider')
                def task = api.providerGet.invoke(provider)
                if (!api.javaCompilerType.isInstance(task)) throw new IllegalStateException('Missing actual Java compiler task')
                task
            }
            at('outgoing-java-compiler-project-owner') {
                if (!projectOwner(api.projectOwnerApi, api.taskProject.invoke(javaTask)).is(ownerState)) {
                    throw new IllegalStateException('Missing actual Java compiler project owner identity')
                }
            }
            tasks.add(javaTask)
        }
        tasks
    }

    static List<Map> kotlinUsages(Map api, Object project, Object target) {
        def ownerState = projectOwner(api.projectOwnerApi, project)
        at('outgoing-target-project-owner') {
            if (!api.targetType.isInstance(target) || !projectOwner(api.projectOwnerApi, api.targetProject.invoke(target)).is(ownerState)) {
                throw new IllegalStateException('Missing actual Kotlin target project owner identity')
            }
        }
        def components = at('outgoing-kotlin-components') {
            def value = api.components.invoke(target)
            if (!(value instanceof Set) || value.size() > 128) throw new IllegalStateException('Unavailable bounded original Kotlin components')
            value
        }
        def result = []
        components.each { component ->
            at('outgoing-kotlin-component-target') {
                if (!api.componentType.isInstance(component) || !api.componentInterface.isInstance(component) ||
                    !api.componentTarget.invoke(component).is(target)) throw new IllegalStateException('Unknown original Kotlin target component')
            }
            def usages = at('outgoing-kotlin-usages') {
                def value = api.usages.invoke(component)
                if (!(value instanceof Set) || value.size() > KtCheckerModelProducerIndex.TASK_LIMIT - result.size()) {
                    throw new IllegalStateException('Unavailable bounded original Kotlin usages')
                }
                value
            }
            usages.each { usage ->
                at('outgoing-kotlin-usage-compilation') {
                    if (!api.usageType.isInstance(usage)) throw new IllegalStateException('Missing original KotlinUsageContext metadata')
                    def compilation = api.usageCompilation.invoke(usage)
                    def name = api.usageConfiguration.invoke(usage)
                    if (!api.compilationType.isInstance(compilation) || !api.compilationTarget.invoke(compilation).is(target) ||
                        !(name instanceof String) || name.isBlank() || name.length() > 4096 || name.indexOf('\u0000') >= 0) {
                        throw new IllegalStateException('Missing actual usage compilation/configuration identity')
                    }
                    result.add([project: project, compilation: compilation, configurationName: name])
                }
            }
        }
        result
    }

    static boolean artifactVariantAttributesMatch(Map component, Map artifact, Collection publishedTypes) {
        if (component == null || artifact == null) return false
        if (component == artifact) return true
        // Preserve EVERY selected component attribute. The only supported difference
        // is the single Gradle artifactType addition evidenced by homogeneous actual
        // outgoing PublishArtifact type metadata. No transforms/default attrs stripping.
        if (component.containsKey('artifactType') || !artifact.containsKey('artifactType') || artifact.size() != component.size() + 1 ||
            !component.every { key, value -> artifact.containsKey(key) && artifact[key] == value } ||
            publishedTypes == null || publishedTypes.isEmpty() || publishedTypes.size() > 4096 || publishedTypes.any {
                !(it instanceof String) || it.isBlank() || it.length() > 4096
            }) return false
        def types = new LinkedHashSet(publishedTypes)
        types.size() == 1 && artifact.artifactType == types.iterator().next()
    }

    static Map matchOutgoingProducer(Object selectedComponent, String moduleId, Map componentAttributes,
        Collection resolvedArtifacts, Collection outgoing) {
        if (selectedComponent == null || moduleId == null || moduleId.isBlank() || moduleId.length() > 4096 || componentAttributes == null ||
            resolvedArtifacts == null || outgoing == null ||
            resolvedArtifacts.size() > 4096 || outgoing.size() > 4096) throw new IllegalStateException('Unavailable exact artifact association inputs')
        // Component equality includes build identity. The caller MUST also retain the
        // independent actual root/selected BuildIdentifier guards before calling this.
        def componentArtifacts = resolvedArtifacts.findAll { it.componentId == selectedComponent }
        def candidates = outgoing.findAll { candidate ->
            candidate.moduleId == moduleId && candidate.attrs == componentAttributes && candidate.compilation != null &&
                candidate.compilationId instanceof String && !candidate.compilationId.isBlank() &&
                !componentArtifacts.isEmpty() && candidate.files instanceof Collection && !candidate.files.isEmpty() &&
                componentArtifacts.every { resolved ->
                    resolved.file instanceof String && candidate.files.contains(resolved.file) && resolved.attrs instanceof Map &&
                        artifactVariantAttributesMatch(componentAttributes, resolved.attrs, candidate.artifactTypes)
                }
        }
        def owners = Collections.newSetFromMap(new IdentityHashMap())
        candidates.each { owners.add(it.compilation) }
        def ids = candidates.collect { it.compilationId }.unique()
        if (owners.size() == 1 && ids.size() == 1) return [state: 'unique', compilationId: ids[0], candidateCount: candidates.size()]
        [state: candidates.isEmpty() ? 'artifact_or_variant_unknown' : 'ambiguous_artifact_producers',
            compilationId: null, candidateCount: candidates.size()]
    }

    static String projectBuildPath(Object id, Class projectType, Class buildType) {
        if (!projectType.isInstance(id)) throw new IllegalStateException('Missing actual ProjectComponentIdentifier')
        def build = projectType.getMethod('getBuild').invoke(id)
        if (!buildType.isInstance(build)) throw new IllegalStateException('Missing actual BuildIdentifier')
        def path = buildType.getMethod('getBuildPath').invoke(build)
        if (!(path instanceof String) || path.length() < 1 || path.length() > 4096 || path.isBlank() ||
            path.toCharArray().any { Character.isISOControl(it as char) }) throw new IllegalStateException('Missing exact buildPath')
        path
    }
}
