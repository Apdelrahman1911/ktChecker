                    }
                    def pluginDataCapture = capture('compiler_arguments_unmodeled', id, 'compiler-plugin-data') {
                        KtChecker2410PinnedModelApi.optionalPluginData(task)
                    }
                    def pluginData = pluginDataCapture?.value
                    def pluginFiles = capture('compiler_arguments_unmodeled', id, 'compiler-plugin-files') {
                        KtChecker2410PinnedModelApi.effectivePluginFiles(task, pluginData)
                    }
                    def plugins = []
                    if (fullArguments != null) {
