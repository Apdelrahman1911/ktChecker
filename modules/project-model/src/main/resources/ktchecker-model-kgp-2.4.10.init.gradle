                        if (compilerVersion != '2.4.10') issue('kotlin_compiler_version_unsupported', id, 'Compiler artifact version is not pinned Kotlin 2.4.10.')
                        [version: compilerVersion, artifacts: compilerCp.collect { file ->
                            def resolved = compilerResolved.find { it.file.canonicalFile == file.canonicalFile }
                            artifact(file, resolved != null ? resolved.moduleVersion.id.toString() : 'compiler-file:' + file.name, id)
