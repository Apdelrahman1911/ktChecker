            }
            // This route does NOT port the old outgoing/deferred owner adapter. Read all
            // resolved dependencies to detect project-produced inputs, retain direct known
            // edges with an unknown producer, and emit a real issue rather than guessing main.
            compilationObjects.each { entry ->
                def p = entry.project
                def fact = entry.fact
                try {
                    def conf = p.configurations.getByName(fact.dependencyConfiguration)
                    def resolution = conf.incoming.resolutionResult
