class KtChecker2410ModelCaptureFailure extends IllegalStateException {
    final String stage
    final String failureKind

    KtChecker2410ModelCaptureFailure(String stage, Throwable cause) {
        super(stage + ': ' + cause.getClass().getSimpleName(), cause)
        this.stage = stage
        this.failureKind = cause.getClass().getSimpleName()
    }
}

class KtChecker2410PinnedModelApi {
    static Object at(String stage, Closure operation) {
        try { return operation.call() }
        catch (KtChecker2410ModelCaptureFailure error) { throw error }
        catch (Exception error) {
            Throwable cause = error
            int depth = 0
            while ((cause instanceof java.lang.reflect.InvocationTargetException ||
                cause instanceof java.lang.reflect.UndeclaredThrowableException ||
                cause instanceof org.codehaus.groovy.runtime.InvokerInvocationException) && cause.getCause() != null && depth++ < 16) cause = cause.getCause()
            if (cause instanceof KtChecker2410ModelCaptureFailure) throw cause
            if (cause instanceof VirtualMachineError || cause instanceof ThreadDeath) throw cause
            throw new KtChecker2410ModelCaptureFailure(stage, cause)
        } catch (LinkageError error) { throw new KtChecker2410ModelCaptureFailure(stage, error) }
    }

    static Object getter(Object instance, String name) {
        if (instance == null) throw new IllegalStateException('Missing instance for pinned getter ' + name)
        instance.getClass().getMethod(name).invoke(instance)
    }

    static List<String> strings(Object value) {
        if (!(value instanceof List) || value.size() > 16384 || value.any {
            !(it instanceof String) || it.length() > 8192 || it.indexOf('\u0000') >= 0
        }) throw new IllegalStateException('Unavailable bounded exact string-vector vocabulary')
        new ArrayList<String>(value)
    }

    static List<String> pathArray(Object value) {
        // A successfully created arguments object's null field means no such operand.
        // It does not establish that a missing plugin/friend provider was verified empty.
        if (value == null) return []
        if (!(value instanceof String[])) throw new IllegalStateException('Unsupported pinned path-array vocabulary')
        strings(Arrays.asList((String[]) value))
    }

    static Map fullCompilerArguments(Object task) {
        def api = at('compiler-api-load') {
            if (task == null || task.getClass().getClassLoader() == null) throw new IllegalStateException('Missing pinned task loader')
            // Resolve ONLY through this actual task/plugin loader. No context/root/system
            // loader retries, guessed overloads, deprecated setup flags, or ignored errors.
            def loader = task.getClass().getClassLoader()
            def producer = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer')
            def context = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer$CreateCompilerArgumentsContext')
            def argumentType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer$ArgumentType')
            def toolArguments = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.CommonToolArguments')
            def factoryType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducerKt')
            def serializerType = loader.loadClass('org.jetbrains.kotlin.compilerRunner.ArgumentUtils')
            if (!producer.isInterface() || !producer.isInstance(task) || !argumentType.isEnum()) {
                throw new IllegalStateException('Unsupported pinned compiler producer/type identity')
            }
            def types = argumentType.getEnumConstants().toList()
            if (types.collect { it.name() } != ['Primitive', 'PluginClasspath', 'DependencyClasspath', 'Sources']) {
                throw new IllegalStateException('Unsupported pinned complete argument-type domain')
            }
            def factory = factoryType.getMethod('CreateCompilerArgumentsContext', Set.class, Boolean.TYPE)
            def create = producer.getMethod('createCompilerArguments', context)
            def serialize = serializerType.getMethod('convertArgumentsToStringList', toolArguments)
            if (!java.lang.reflect.Modifier.isStatic(factory.modifiers) || factory.returnType != context ||
                create.returnType != toolArguments || !java.lang.reflect.Modifier.isStatic(serialize.modifiers) ||
                !List.class.isAssignableFrom(serialize.returnType)) {
                throw new IllegalStateException('Unsupported pinned compiler method signatures')
            }
            [factory: factory, create: create, serialize: serialize, types: new LinkedHashSet(types),
                contextType: context, argumentsType: toolArguments]
        }
        def context = at('compiler-arguments-context') {
            def value = api.factory.invoke(null, api.types, false)
            if (!api.contextType.isInstance(value)) throw new IllegalStateException('Missing exact compiler argument context')
            value
        }
        def value = at('compiler-arguments-create') {
            def arguments = api.create.invoke(task, context)
            if (!api.argumentsType.isInstance(arguments)) throw new IllegalStateException('Missing exact compiler arguments object')
            arguments
        }
        def arguments = at('compiler-arguments-serialize') { strings(api.serialize.invoke(null, value)) }
        // Intended full task-configuration serialization at the exporter lifecycle point,
        // NOT evidence that this compiler task or a compiler child process actually ran.
        [value: value, arguments: arguments]
    }

    static Object optionalPluginData(Object task) {
        def provider = at('compiler-plugin-data-provider') { getter(task, 'getKotlinPluginData$kotlin_gradle_plugin_common') }
        if (provider == null) return [state: 'provider_absent', value: null]
        def value = at('compiler-plugin-data-value') { getter(provider, 'getOrNull') }
        [state: value == null ? 'value_absent' : 'available', value: value]
    }

    static List<File> effectivePluginFiles(Object task, Object pluginData) {
        def files = getter(task, 'getPluginClasspath')
        if (files == null) throw new IllegalStateException('Missing default compiler plugin classpath')
        // The pinned KGP composes FileCollections in this order. Do not sort, flatten
        // into an inferred union, or discard the default scripting compiler plugins.
        if (pluginData != null) files = files.plus(getter(pluginData, 'getClasspath'))
        def result = files.toList()
        if (result.any { !(it instanceof File) }) throw new IllegalStateException('Unsupported compiler plugin file vocabulary')
        result
    }

    static void samePaths(List<String> operands, List<File> files) {
        if (operands != files.collect { it.absolutePath }) throw new IllegalStateException('Exact ordered task/argument path roles differ')
    }

    static Map ordinaryJvmProducer(Object task, Object fullCapture) {
        at('compiler-jvm-original-producer') {
            if (task == null || task.getClass().getClassLoader() == null || !(fullCapture instanceof Map)) {
                throw new IllegalStateException('Missing original JVM producer capture')
            }
            // The registered owner runtime supplies the byte pins. A class name alone is
            // NOT origin authority. These checks additionally reject custom dispatch and
            // argument-object implementations for the reviewed KGP lowering semantics.
            def loader = task.getClass().getClassLoader()
            def taskType = loader.loadClass('org.jetbrains.kotlin.gradle.tasks.KotlinCompile')
            def baseType = loader.loadClass('org.jetbrains.kotlin.gradle.tasks.AbstractKotlinCompile')
            def contextType = loader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinCompilerArgumentsProducer$CreateCompilerArgumentsContext')
            def argumentsType = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.K2JVMCompilerArguments')
            def commonArgumentsType = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.CommonCompilerArguments')
            def toolArgumentsType = loader.loadClass('org.jetbrains.kotlin.cli.common.arguments.CommonToolArguments')
            def changesType = loader.loadClass('org.gradle.work.InputChanges')
            def backupType = loader.loadClass('org.jetbrains.kotlin.gradle.tasks.TaskOutputsBackup')
            def providerType = loader.loadClass('org.gradle.api.provider.Provider')
            if (!taskType.isInstance(task) || fullCapture.value == null || !fullCapture.value.getClass().is(argumentsType)) {
                throw new IllegalStateException('Unsupported ordinary JVM producer/argument object')
            }
            def creates = task.getClass().getMethods().findAll { method ->
                method.name == 'createCompilerArguments' && method.parameterTypes.toList() == [contextType]
            }
            def lowers = task.getClass().getMethods().findAll { method ->
                method.name == 'callCompilerAsync$kotlin_gradle_plugin_common' && method.parameterCount == 3 &&
                    method.parameterTypes[1].is(changesType) && method.parameterTypes[2].is(backupType)
            }
            if (creates.size() != 2 || creates.collect { it.returnType }.toSet() != [argumentsType, toolArgumentsType].toSet() ||
                lowers.size() != 2 || lowers.collect { it.parameterTypes[0] }.toSet() != [argumentsType, commonArgumentsType].toSet() ||
                (creates + lowers).any { method -> !method.declaringClass.is(taskType) ||
                    java.lang.reflect.Modifier.isStatic(method.modifiers) || java.lang.reflect.Modifier.isAbstract(method.modifiers) } ||
                lowers.any { !it.returnType.is(Void.TYPE) }) {
                throw new IllegalStateException('Custom or unavailable pinned JVM producer/lowering dispatch')
            }
            def pluginGetter = task.getClass().getMethod('getKotlinPluginData$kotlin_gradle_plugin_common')
            if (!pluginGetter.declaringClass.is(baseType) || !pluginGetter.returnType.is(providerType) ||
                !java.lang.reflect.Modifier.isFinal(pluginGetter.modifiers)) {
                throw new IllegalStateException('Unknown nullable plugin metadata producer')
            }
            [taskType: taskType, argumentsType: argumentsType]
        }
    }

    static List<File> originalFiles(Object collection) {
        def files = getter(collection, 'getFiles')
        if (!(files instanceof Set) || files.size() > 16384 || files.any { !(it instanceof File) }) {
            throw new IllegalStateException('Unavailable exact bounded Gradle file collection')
        }
        new ArrayList<File>(files)
    }

    static String emptyJvmInputDomain(Object task, Object fullCapture, Object pluginCapture, Object effectiveFiles) {
        ordinaryJvmProducer(task, fullCapture)
        if (!(pluginCapture instanceof Map) || !(effectiveFiles instanceof List) || !effectiveFiles.isEmpty() ||
            !(pluginCapture.state in ['provider_absent', 'value_absent']) || pluginCapture.value != null) {
            throw new IllegalStateException('Missing independent empty plugin-domain observations')
        }
        def arguments = fullCapture.value
        ['getPluginClasspaths', 'getPluginOptions', 'getPluginConfigurations', 'getPluginOrderConstraints'].each { name ->
            if (!pathArray(getter(arguments, name)).isEmpty()) throw new IllegalStateException('Nonempty compiler plugin argument domain')
        }
        if (getter(arguments, 'getIntellijPluginRoot') != null || strings(fullCapture.arguments).any { token ->
            token.startsWith('@') || token == '-P' || token.startsWith('-P=') || token.startsWith('-Xplugin') ||
                token.startsWith('-Xcompiler-plugin') || token.startsWith('-Xintellij-plugin-root')
        }) throw new IllegalStateException('Plugin/response argument semantics are not an empty domain')
        // Narrower than the legacy route: no unreviewed allOptions()/lazy-config
        // semantics. Even a nonnull apparently empty plugin-data/config object is a gap.
        def taskOptions = getter(getter(task, 'getPluginOptions'), 'get')
        if (!(taskOptions instanceof List) || !taskOptions.isEmpty()) {
            throw new IllegalStateException('Only an independently empty task plugin-option list is supported')
        }
        if (!effectivePluginFiles(task, pluginCapture.value).isEmpty() || !originalFiles(getter(task, 'getJavaSources')).isEmpty()) {
            throw new IllegalStateException('Nonempty actual plugin or Java input domain')
        }
        def scripts = getter(task, 'getScriptSources$kotlin_gradle_plugin_common')
        if (!originalFiles(scripts).isEmpty() || !originalFiles(getter(scripts, 'getAsFileTree')).isEmpty() ||
            getter(getter(task, 'getMultiPlatformEnabled'), 'get') != Boolean.FALSE ||
            getter(arguments, 'getMultiPlatform') != Boolean.FALSE || getter(arguments, 'getScript') != Boolean.FALSE ||
            getter(arguments, 'getRepl') != Boolean.FALSE || getter(arguments, 'getExpression') != null ||
            getter(arguments, 'getBuildFile') != null || getter(arguments, 'getJavaPackagePrefix') != null ||
            getter(arguments, 'getUseFirLT') != Boolean.TRUE) {
            throw new IllegalStateException('Nonordinary script/Java/refinement/frontend domain')
        }
        def declaredFriends = getter(task, 'getFriendPaths').toList()
        if (!declaredFriends.isEmpty() || !pathArray(getter(arguments, 'getFriendPaths')).isEmpty()) {
            throw new IllegalStateException('No friend/associated/deferred output is supported by this new route')
        }
        // The exact pinned2.4.10 hierarchy has these fragment getters, not getFragmentIncrementalClasspath.
        // A missing real getter remains an error; do not graft later-version getters or optional fallbacks.
        ['getCommonSources', 'getFragments', 'getFragmentSources', 'getFragmentRefines',
            'getFragmentDependencies', 'getFragmentFriendDependencies',
            'getJavaSourceRoots', 'getScriptTemplates', 'getScriptResolverEnvironment'].each { name ->
            if (!pathArray(getter(arguments, name)).isEmpty()) throw new IllegalStateException('Nonordinary source/input argument domain')
        }
        pluginCapture.state
    }

    static boolean verifyConfiguredJvmInputs(Object task, Object fullCapture, Object sourceRoot, Object selectedHome,
        Object sourceFiles, Object classpath, Object pluginDomain) {
        ordinaryJvmProducer(task, fullCapture)
        if (File.separator != '/' || File.pathSeparator != ':' || !(sourceRoot instanceof java.nio.file.Path) ||
            !(selectedHome instanceof String) || !(sourceFiles instanceof List) || !(classpath instanceof List) ||
            !(pluginDomain in ['provider_absent', 'value_absent'])) {
            throw new IllegalStateException('Unavailable original POSIX JVM role domain')
        }
        def root = sourceRoot.toAbsolutePath().normalize()
        if (root != sourceRoot || root.toRealPath() != root) throw new IllegalStateException('Unaliased original snapshot root required')
        def arguments = fullCapture.value
        // The pinned Sources producer appends scripts + Java + Kotlin, with Kotlin in
        // this actual FileTree iteration order. Java/scripts were independently empty.
        def files = originalFiles(getter(getter(task, 'getSources'), 'getAsFileTree'))
        samePaths(strings(getter(arguments, 'getFreeArgs')), files)
        def paths = files.collect { file ->
            def path = file.toPath().toAbsolutePath().normalize()
            if (path.toString() != file.absolutePath || !path.startsWith(root) || path == root ||
                !file.name.endsWith('.kt') || !java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) ||
                path.toRealPath() != path) throw new IllegalStateException('Nonregular or aliased original Kotlin source')
            root.relativize(path).toString()
        }
        if (sourceFiles.any { !(it instanceof Map) || !(it.path instanceof String) } ||
            paths.size() != paths.toSet().size() || sourceFiles.collect { it.path }.size() != sourceFiles.collect { it.path }.toSet().size() ||
            paths.toSet() != sourceFiles.collect { it.path }.toSet()) {
            throw new IllegalStateException('Original source order is not a bijection of complete model membership')
        }
        def declared = originalFiles(getter(task, 'getLibraries'))
        def operand = getter(arguments, 'getClasspath')
        if ((operand != null && !(operand instanceof String)) || classpath.any { !(it instanceof Map) || !(it.path instanceof String) } ||
            classpath.collect { it.path } != declared.collect { it.absolutePath } || declared.any { file ->
                def path = file.toPath().toAbsolutePath().normalize()
                path.toString() != file.absolutePath || !file.name.endsWith('.jar') ||
                    !java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS) || path.toRealPath() != path
            } || (operand == null ? !declared.findAll { it.exists() }.isEmpty() :
                operand != declared.collect { it.absolutePath }.join(File.pathSeparator))) {
            throw new IllegalStateException('Original full ordered classpath role differs from independently captured task files')
        }
        def destination = getter(arguments, 'getDestination')
        def directory = getter(getter(getter(task, 'getDestinationDirectory'), 'get'), 'getAsFile')
        def jdk = getter(arguments, 'getJdkHome')
        def selected = new File(selectedHome).toPath()
        if (!(destination instanceof String) || !(directory instanceof File) || destination != directory.absolutePath ||
            directory.toPath().toAbsolutePath().normalize().toString() != destination || directory.canonicalPath != destination ||
            !selected.isAbsolute() || selected.normalize() != selected || selected.toRealPath() != selected ||
            (jdk != null && (!(jdk instanceof String) || jdk != selectedHome))) {
            throw new IllegalStateException('Original destination/JDK task roles are not exact')
        }
        true // A checked configuration fact only; never a JVM argument-layout capability.
    }

    static String projectBuildPath(Object id, Class projectType, Class buildType) {
        if (!projectType.isInstance(id)) throw new IllegalStateException('Missing actual ProjectComponentIdentifier')
        def build = projectType.getMethod('getBuild').invoke(id)
        if (!buildType.isInstance(build)) throw new IllegalStateException('Missing actual BuildIdentifier')
        def path = buildType.getMethod('getBuildPath').invoke(build)
        if (!(path instanceof String) || path.length() < 1 || path.length() > 4096 || path.isBlank() ||
            path.toCharArray().any { Character.isISOControl(it as char) }) throw new IllegalStateException('Missing exact buildPath')
        path
    }
