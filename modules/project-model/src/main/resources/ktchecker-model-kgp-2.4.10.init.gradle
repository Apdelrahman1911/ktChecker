                        if (!(selectedHome instanceof File)) throw new IllegalStateException('Unavailable exact selected JVM home')
                        // KGP 2.4.10 fills a null args.jdkHome later in its compiler runner.
                        // This is the independently selected task JDK, NOT an observed argv.
