                        def compilerConfiguration = p.configurations.getByName('kotlinCompilerClasspath')
                        def compilerResolved = compilerConfiguration.resolvedConfiguration.resolvedArtifacts.toList()
                        def compilerIdentity = compilerResolved.findAll { a -> a.moduleVersion.id.group == 'org.jetbrains.kotlin' &&
                            a.moduleVersion.id.name == 'kotlin-compiler-embeddable' && compilerCp.any { it.canonicalFile == a.file.canonicalFile } }
