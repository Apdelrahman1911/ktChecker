                                issue('included_project_dependency_unmodeled', fact.id, 'Actual project dependency is outside this root model.')
                            } else {
                                def variant = dependency.resolvedVariant
                                fact.projectDependencies << [moduleId: selected.projectPath, selectedVariant: variant.displayName,
                                    variantAttributes: attributes(variant.attributes), compilationId: null]
                            }
