                        capture('compiler_arguments_unmodeled', id, 'compiler-friend-argument-roles') {
                            KtChecker2410PinnedModelApi.samePaths(KtChecker2410PinnedModelApi.pathArray(known(fullArguments.value, 'getFriendPaths')), friendFiles)
