name: Preview implementation (real pinned JVM)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementation-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  checker-host:
    name: JVM 21 checker build and installed launcher (${{ matrix.os }})
    # Provisional Windows headroom; POSIX bounds and required checks are unchanged.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-24.04
            python_timeout_seconds: 480
            job_timeout_minutes: 30
            supervisor_python: python3
            supervisor_cc_argument: '--cc /usr/bin/cc'
            supervisor_cc_property: '-PnativeSupervisorCc=/usr/bin/cc'
            library_profile: supported
            library_opt_in: 'true'
            evidence_profile: checker-host-supported-library-controls
          - os: windows-2025
            python_timeout_seconds: 1200
            job_timeout_minutes: 60
            supervisor_python: python
            supervisor_cc_argument: ''
            supervisor_cc_property: ''
            library_profile: windows-portability
            library_opt_in: 'false'
            evidence_profile: checker-host-windows-portability
          - os: macos-26
            python_timeout_seconds: 480
            job_timeout_minutes: 30
            supervisor_python: python3
            supervisor_cc_argument: '--cc /usr/bin/cc'
            supervisor_cc_property: '-PnativeSupervisorCc=/usr/bin/cc'
            library_profile: supported
            library_opt_in: 'true'
            evidence_profile: checker-host-supported-library-controls
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out candidate (no persisted credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up CI evidence runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up broker JVM 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the evidence harness failure paths
        # This replaces only unittest's console reporter, not its discovery scope.
        # JSON and diagnostic XML are a pair; neither a job ID nor empty XML is a pass.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory scripts/ci
          --output build/ci-evidence/python/python-checks.json
          --junit build/ci-evidence/python/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Verify compiler diagnostic breadth source controls
        if: always()
        # Additive fixture-source controls outside scripts/ci, not a provider cohort.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory providers/compiler-fixtures
          --pattern "test_diagnostic_breadth*.py"
          --output build/ci-evidence/compiler-breadth/python-checks.json
          --junit build/ci-evidence/compiler-breadth/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Retain compiler breadth source-control diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-breadth-source-controls-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/compiler-breadth/python-checks.json
            build/ci-evidence/compiler-breadth/python-checks.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify compiler checker activation source controls
        if: always()
        # Additive registration/source controls, not a compiler/provider execution cohort.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory providers/compiler-fixtures
          --pattern "test_checker_activation*.py"
          --output build/ci-evidence/checker-activation/python-checks.json
          --junit build/ci-evidence/checker-activation/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Retain checker activation source-control diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-checker-activation-source-controls-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/checker-activation/python-checks.json
            build/ci-evidence/checker-activation/python-checks.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify compiler mapping contract source controls
        if: always()
        # Explicit mapping SOURCE contracts, not a compiler/provider execution cohort.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory providers/compiler-fixtures
          --pattern "test_compiler_mapping_contracts.py"
          --output build/ci-evidence/compiler-mapping-contracts/python-checks.json
          --junit build/ci-evidence/compiler-mapping-contracts/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Retain compiler mapping contract source-control diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-mapping-contracts-source-controls-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/compiler-mapping-contracts/python-checks.json
            build/ci-evidence/compiler-mapping-contracts/python-checks.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify compiler nullability protocol source controls
        if: always()
        # Both authored protocol modules remain selected; no compiler is invoked here.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory providers/compiler-fixtures
          --pattern "test_nullability_protocols*.py"
          --output build/ci-evidence/compiler-nullability-protocols/python-checks.json
          --junit build/ci-evidence/compiler-nullability-protocols/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Retain compiler nullability protocol source-control diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-nullability-protocols-source-controls-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/compiler-nullability-protocols/python-checks.json
            build/ci-evidence/compiler-nullability-protocols/python-checks.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify compiler original42 selector source controls
        if: always()
        # Literal legacy selector SOURCE checks do not replay any historical evidence.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory providers/compiler-fixtures
          --pattern "test_original42_selectors.py"
          --output build/ci-evidence/compiler-original42-selectors/python-checks.json
          --junit build/ci-evidence/compiler-original42-selectors/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Retain compiler original42 selector source-control diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-original42-selectors-source-controls-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/compiler-original42-selectors/python-checks.json
            build/ci-evidence/compiler-original42-selectors/python-checks.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify compiler type-boundary supplemental source controls
        if: always()
        # Supplemental SOURCE contracts remain separate from provider/runtime qualification.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory providers/compiler-fixtures
          --pattern "test_type_boundaries_supplemental.py"
          --output build/ci-evidence/compiler-type-boundaries-supplemental/python-checks.json
          --junit build/ci-evidence/compiler-type-boundaries-supplemental/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Retain compiler type-boundary supplemental source-control diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-type-boundaries-supplemental-source-controls-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/compiler-type-boundaries-supplemental/python-checks.json
            build/ci-evidence/compiler-type-boundaries-supplemental/python-checks.xml
          if-no-files-found: error
          retention-days: 14
      - name: Verify synthetic Lint receipt privacy without relying on Python assertions
        if: runner.os == 'Linux'
        run: |
          python providers/platform-fixtures/test_retain_lint_evidence.py -q
          python -O providers/platform-fixtures/test_retain_lint_evidence.py -q
      - name: Record initial host and pinned wrapper
        run: python scripts/ci/record_environment.py --output build/ci-evidence/environment-initial.json --require-java-major 21 --require-ci-context
      - name: Execute the checksum-pinned Gradle wrapper
        run: python scripts/ci/run_gradle.py --output build/ci-evidence/gradle-version.json --timeout 180 -- --version
      - name: Bind observed Gradle to the selected JVM
        if: always()
        run: python scripts/ci/record_environment.py --output build/ci-evidence/environment.json --require-java-major 21 --require-gradle 9.6.1 --gradle-result build/ci-evidence/gradle-version.json --require-ci-context
      - name: Observe exact helper build inputs and compiler or explicit unsupported host
        if: always()
        # Version probes only, under the builder's minimal environment. No
        # compiler/toolchain download, helper run or transitive closure claim.
        run: >-
          python scripts/ci/run_supervisor_checks.py --phase preflight
          --output build/ci-evidence/supervisor-prerequisites.json
          --environment build/ci-evidence/environment.json
          --python-command ${{ matrix.supervisor_python }}
          ${{ matrix.supervisor_cc_argument }}
      - name: Execute exact tiny native controls or record Windows native unavailability
        if: always()
        # Linux requires existing /usr/bin/strace: absence is a visible failure.
        # Darwin has two explicit Linux-only skips, never a syscall/owner-death
        # proof. Windows executes no compiler/helper; policy success is not a
        # native-test pass. These C/Python fixtures are not provider qualification.
        run: >-
          python scripts/ci/run_supervisor_checks.py --phase controls
          --output build/ci-evidence/supervisor-controls.json
          --prerequisites build/ci-evidence/supervisor-prerequisites.json
          --python-command ${{ matrix.supervisor_python }}
          ${{ matrix.supervisor_cc_argument }}
      - name: Retain direct original owned live supervisor controls on every host
        if: always()
        # The original in-process harness owns deadlines and custody: no outer
        # timeout/kill wrapper. macOS/Windows native controls stay unavailable,
        # not simulated passes. This distinct JSON/XML pair is not generic JUnit
        # or command-result evidence; the direct exit independently gates CI.
        run: >-
          python -B scripts/ci/live_supervisor_test_runner.py
          --output build/ci-evidence/live-supervisor/live-supervisor-checks.json
          --junit build/ci-evidence/live-supervisor/live-supervisor-checks.xml
          --host "${{ matrix.os }}" --require-ci-context
          ${{ matrix.supervisor_cc_argument }}
      - name: Provision pinned optional provider libraries or record Windows unavailability
        # Only supported POSIX hosts download the five Detekt and three Ktlint pins.
        # Windows remains a build/test/package lane, not a fictitious provider pass.
        run: >-
          python scripts/ci/run_library_checks.py --phase provision
          --profile ${{ matrix.library_profile }}
          --output build/ci-evidence/library-prerequisites.json
          --environment build/ci-evidence/environment.json
      - name: Build a fresh owned live probe on Linux without executing it
        if: runner.os == 'Linux'
        # Exclusive new private output: no clearing, reuse, probe run or retry.
        # Only receipt.json is publishable; built bytes are not execution proof.
        run: >-
          python3 -B scripts/ci/build_live_probe.py --cc /usr/bin/cc
          --output "${{ github.workspace }}/build/ci-evidence/live-probe"
      - name: Build and test actual modules; assemble preview distributions
        env:
          KTC_RUN_OWNED_LIVE_INTEGRATION: ${{ runner.os == 'Linux' && '1' || '' }}
          KTC_OWNED_LIVE_PROBE: ${{ runner.os == 'Linux' && format('{0}/build/ci-evidence/live-probe/probe', github.workspace) || '' }}
        run: >-
          python scripts/ci/run_gradle.py
          --output build/ci-evidence/host-build.json --timeout 1200
          --require-task :contracts:test --require-task :audit:test
          --require-task :kernel:test --require-task :project-model:test
          --require-task :provider-architecture:test --require-task :review-controller:test
          --require-task :worker-protocol:test --require-task :provider-compiler:test
          --require-task :provider-compiler:workerTest
          --require-task :worker-protocol:modelWireTest --require-task :provider-compiler:modelWorkerTest
          --require-task :provider-compiler:compilerModelApplicationWorkerJar
          --require-task :provider-build-contracts:test
          --require-task :provider-runtime:buildOwnedProcessSupervisor --require-task :provider-runtime:test
          --require-task :provider-runtime:buildOwnedLiveProcessSupervisor
          --require-task :provider-detekt:test --require-task :provider-ktlint:test
          --require-task :cli:installDist --require-task :cli:distZip --require-task :cli:distTar
          -- --rerun-tasks --no-build-cache test :worker-protocol:modelWireTest :provider-compiler:modelWorkerTest
          :provider-build-contracts:test :cli:installDist :cli:distZip :cli:distTar
          -PdetektIntegration=${{ matrix.library_opt_in }} -PktlintIntegration=${{ matrix.library_opt_in }}
          -PlibraryFixtureEvidenceRoot=build/ci-evidence/raw/library-fixtures
          -PnativeSupervisorPython=${{ matrix.supervisor_python }} ${{ matrix.supervisor_cc_property }}
      - name: Select exact audited Node runtime for real broker interoperability
        if: success() && runner.os == 'Linux'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          check-latest: false
      - name: Build locked MCP bridge for real broker interoperability
        if: success() && runner.os == 'Linux'
        working-directory: bridges/mcp
        shell: bash
        env:
          NODE_OPTIONS: ''
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run build --ignore-scripts
      - name: Require real broker wire interoperability from the fresh installation
        if: success() && runner.os == 'Linux'
        working-directory: bridges/mcp
        shell: bash
        timeout-minutes: 8
        env:
          KTC_TEST_CLI_DISTRIBUTION: ${{ github.workspace }}/modules/cli/build/install/ktchecker
          NODE_OPTIONS: ''
        # Local Linux broker wire only; no provider/model or publication claim.
        # The same-job installDist above is required and forced, not an old image.
        # Raw reporter bytes stay in owned runner temp files, never artifact globs.
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          test -d "$KTC_TEST_CLI_DISTRIBUTION"
          test -x "$KTC_TEST_CLI_DISTRIBUTION/bin/ktchecker"
          test -f dist/test/real-broker-wire.test.js
          umask 077
          report_dir="$(mktemp -d "${RUNNER_TEMP:?}/ktc-real-broker-wire.XXXXXX")"
          trap 'rm -rf -- "$report_dir"' EXIT
          if node --test --test-concurrency=1 --test-reporter=tap dist/test/real-broker-wire.test.js >"$report_dir/results.tap" 2>"$report_dir/stderr.txt"; then
            :
          else
            status=$?
            echo "::error::Real broker interoperability tests failed (Node exit $status); no qualification."
            exit "$status"
          fi
          python - "$report_dir/results.tap" <<'PYTHON'
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8") as report:
              body = report.read(1_048_577)
          if len(body) > 1_048_576:
              raise SystemExit("Real broker TAP report exceeds its bound; no qualification")
          observed = re.findall(r"^# (tests|suites|pass|fail|cancelled|skipped|todo) ([0-9]+)$", body, re.MULTILINE)
          expected = {"tests": "3", "suites": "0", "pass": "3", "fail": "0", "cancelled": "0", "skipped": "0", "todo": "0"}
          if len(observed) != len(expected) or dict(observed) != expected:
              raise SystemExit("Real broker gate requires exactly three passes and zero skips/failures/cancellations/todos")
          print("Real Linux broker wire interoperability: 3 passed, 0 skipped; not provider/model or publication qualification.")
          PYTHON
      - name: Declare real broker interoperability unavailable on non-Linux hosts
        if: always() && runner.os != 'Linux'
        # Informational only: these rows do not pass or qualify the Linux gate.
        run: >-
          echo "Real broker interoperability is unavailable on non-Linux hosts; these rows do not qualify the broker wire."
      - name: Verify exact genuine library controls or visible Windows opt-out skips
        if: always()
        run: >-
          python scripts/ci/run_library_checks.py --phase collect
          --profile ${{ matrix.library_profile }}
          --output build/ci-evidence/library-controls.json
          --prerequisites build/ci-evidence/library-prerequisites.json
          --build build/ci-evidence/host-build.json
      - name: Resolve actual installed distribution coordinates and Maven POMs
        run: >-
          python scripts/ci/run_gradle.py
          --output build/ci-evidence/dependency-manifest-command.json --timeout 300
          --require-task :cli:writeDistributionDependencyManifest
          -- --no-build-cache --init-script scripts/ci/distribution-dependencies.init.gradle
          :cli:writeDistributionDependencyManifest
      - name: Execute installed native launcher from a spaces and Unicode path
        run: python scripts/ci/smoke_distribution.py --output build/ci-evidence/distribution-smoke.json
      - name: Verify actual host-specific helper receipt and installed doctor bytes
        if: always()
        # The preview archive is host-specific, not universal. Bundled byte
        # inspection never becomes native ABI, process or release qualification.
        run: >-
          python scripts/ci/run_supervisor_checks.py --phase collect
          --output build/ci-evidence/supervisor-installed-bytes.json
          --prerequisites build/ci-evidence/supervisor-prerequisites.json
          --controls build/ci-evidence/supervisor-controls.json
          --build build/ci-evidence/host-build.json
          --smoke build/ci-evidence/distribution-smoke.json
      - name: Inventory actual dependency bytes, declared licenses and retained notices
        if: always()
        # Preview inventory may pass while legal review is explicitly blocked.
        # No owner license is invented and no release/signing gate is granted.
        run: >-
          python scripts/ci/report_distribution.py
          --dependencies build/ci-evidence/raw/distribution-dependencies.json
          --output build/ci-evidence/package-report.json
          --sbom build/ci-evidence/distribution.cdx.json
          --notice build/ci-evidence/NOTICE.dependency-report.txt
      - name: Compare actual ZIP and TAR manifests with staged installation
        id: distribution_archive_integrity
        if: success() && (runner.os == 'Linux' || runner.os == 'macOS')
        timeout-minutes: 3
        # Exact Gradle distributionBaseName/version, not a wildcard selection.
        # Read-only decoded bytes/names/executable flags; no extraction/runtime,
        # license approval, historical build binding or atomic upload snapshot.
        run: >-
          python scripts/ci/verify_distribution_archives.py
          --installation modules/cli/build/install/ktchecker
          --expected-prefix ktchecker-0.1.0-dev.1
          --archive modules/cli/build/distributions/ktchecker-0.1.0-dev.1.zip
          --archive modules/cli/build/distributions/ktchecker-0.1.0-dev.1.tar
          --output build/ci-evidence/distribution-archives.json
      - name: Declare Windows archive verification unavailable and upload blocked
        if: always() && runner.os == 'Windows'
        # Informational only: the verifier step stays skipped, not successful.
        # Windows build/test/package scope is unchanged; no emulated POSIX pass.
        run: >-
          echo "Archive verification unavailable on Windows: POSIX no-follow required; preview archive upload remains blocked."
      - name: Require reviewed licenses before owner-approved preview distribution upload
        id: distribution_upload_license_review
        if: success() && vars.KTC_PREVIEW_DISTRIBUTION_UPLOAD_APPROVED == 'true'
        # Owner opt-in never bypasses unresolved owner/dependency/shaded/NOTICE review.
        # Distinct outputs preserve the unconditional preview inventory evidence.
        run: >-
          python scripts/ci/report_distribution.py
          --dependencies build/ci-evidence/raw/distribution-dependencies.json
          --output build/ci-evidence/distribution-upload-review.json
          --sbom build/ci-evidence/distribution-upload-review.cdx.json
          --notice build/ci-evidence/NOTICE.distribution-upload-review.txt
          --require-license-review
      - name: Collect actual suites and artifact identities, including failures
        if: always()
        env:
          KT_CI_JOB_STATUS: ${{ job.status }}
        run: >-
          python scripts/ci/collect_evidence.py
          --output build/ci-evidence/evidence.json --profile ${{ matrix.evidence_profile }}
          --environment build/ci-evidence/environment.json
          --reports "modules/*/build/test-results/**/*.xml"
          --reports "tests/audit/build/test-results/**/*.xml"
          --require-report "modules/contracts/build/test-results/test/*.xml"
          --require-report "tests/audit/build/test-results/test/*.xml"
          --require-report "modules/kernel/build/test-results/test/*.xml"
          --require-report "modules/kernel/build/test-results/test/TEST-dev.ktchecker.kernel.IntegratedCompletionBarrierTest.xml"
          --require-report "modules/kernel/build/test-results/test/TEST-dev.ktchecker.kernel.IntegratedCompletionAuditCodecTest.xml"
          --require-report "modules/kernel/build/test-results/test/TEST-dev.ktchecker.kernel.KernelPlanIntegrationTest.xml"
          --require-report "modules/kernel/build/test-results/test/TEST-dev.ktchecker.kernel.KernelStressTest.xml"
          --require-report "modules/project-model/build/test-results/test/*.xml"
          --require-report "modules/provider-architecture/build/test-results/test/*.xml"
          --require-report "modules/review-controller/build/test-results/test/*.xml"
          --require-report "modules/review-controller/build/test-results/test/TEST-dev.ktchecker.reviewcontroller.OwnerIntegratedCompletionRegistryTest.xml"
          --require-report "modules/provider-build-contracts/build/test-results/test/TEST-dev.ktchecker.providers.buildcontracts.GradleWrapperChecksumProviderTest.xml"
          --require-report "modules/provider-build-contracts/build/test-results/test/TEST-dev.ktchecker.providers.buildcontracts.InstalledWrapperContextTest.xml"
          --require-report "modules/provider-build-contracts/build/test-results/test/TEST-dev.ktchecker.providers.buildcontracts.WrapperActivationPolicyBoundsTest.xml"
          --require-report "modules/provider-build-contracts/build/test-results/test/TEST-dev.ktchecker.providers.buildcontracts.WrapperPropertiesTest.xml"
          --require-report "modules/provider-build-contracts/build/test-results/test/TEST-dev.ktchecker.providers.buildcontracts.WrapperChecksumConsumerIntegrationTest.xml"
          --require-report "modules/provider-build-contracts/build/test-results/test/TEST-dev.ktchecker.providers.buildcontracts.WrapperRulePolicyIntegrationTest.xml"
          --require-report "modules/provider-runtime/build/test-results/test/*.xml"
          --require-report "modules/worker-protocol/build/test-results/test/TEST-dev.ktchecker.workerprotocol.ApplicationWireTest.xml"
          --require-report "modules/worker-protocol/build/test-results/test/TEST-dev.ktchecker.workerprotocol.CompilerJobWireTest.xml"
          --require-report "modules/worker-protocol/build/test-results/modelWireTest/TEST-dev.ktchecker.workerprotocol.CompilerModelWireTest.xml"
          --require-report "modules/provider-compiler/build/test-results/test/TEST-dev.ktchecker.compiler.live.CompilerApplicationLifecycleTest.xml"
          --require-report "modules/provider-compiler/build/test-results/test/TEST-dev.ktchecker.compiler.live.CompilerLiveHostAuthorityTest.xml"
          --require-report "modules/provider-compiler/build/test-results/test/TEST-dev.ktchecker.compiler.live.CompilerLiveRenderingTest.xml"
          --require-report "modules/provider-compiler/build/test-results/workerTest/TEST-dev.ktchecker.compilerworker.live.CompilerApplicationLifecycleTest.xml"
          --require-report "modules/provider-compiler/build/test-results/workerTest/TEST-dev.ktchecker.compilerworker.live.CompilerApplicationFilesystemTest.xml"
          --require-report "modules/provider-compiler/build/test-results/modelWorkerTest/TEST-dev.ktchecker.compilerworker.live.CompilerModelApplicationFilesystemTest.xml"
          --require-report "modules/provider-compiler/build/test-results/modelWorkerTest/TEST-dev.ktchecker.compilerworker.live.CompilerModelApplicationLifecycleTest.xml"
          --require-report "modules/provider-runtime/build/test-results/test/TEST-dev.ktchecker.providers.runtime.OwnedApplicationSessionsTest.xml"
          --require-report "modules/provider-runtime/build/test-results/test/TEST-dev.ktchecker.providers.runtime.OwnedApplicationTypesTest.xml"
          --require-tests
          --require-artifact "modules/kernel/build/reports/stress/kernel-100-patches.json"
          --require-artifact "modules/cli/build/distributions/*.zip"
          --require-artifact "modules/cli/build/distributions/*.tar"
          --artifact build/ci-evidence/distribution-archives.json
          --command-result build/ci-evidence/gradle-version.json
          --command-result build/ci-evidence/supervisor-prerequisites.json
          --command-result build/ci-evidence/supervisor-controls.json
          --command-result build/ci-evidence/library-prerequisites.json
          --command-result build/ci-evidence/host-build.json
          --command-result build/ci-evidence/library-controls.json
          --command-result build/ci-evidence/dependency-manifest-command.json
          --command-result build/ci-evidence/distribution-smoke.json
          --command-result build/ci-evidence/supervisor-installed-bytes.json
          --command-result build/ci-evidence/package-report.json
      - name: Retain sanitized observed evidence (not terminal transcripts)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/*.json
            build/ci-evidence/python/python-checks.json
            build/ci-evidence/python/python-checks.xml
            build/ci-evidence/live-supervisor/live-supervisor-checks.json
            build/ci-evidence/live-supervisor/live-supervisor-checks.xml
            build/ci-evidence/live-probe/receipt.json
            build/ci-evidence/NOTICE.dependency-report.txt
            build/ci-evidence/NOTICE.distribution-upload-review.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain original controlled-fixture JUnit and kernel stress reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-original-reports-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            modules/*/build/test-results/**/*.xml
            tests/audit/build/test-results/**/*.xml
            modules/kernel/build/reports/stress/*.json
          # A failure before tests emits no fabricated empty report.
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the actual tested unsigned preview distribution
        if: success() && vars.KTC_PREVIEW_DISTRIBUTION_UPLOAD_APPROVED == 'true' && steps.distribution_upload_license_review.outcome == 'success' && steps.distribution_archive_integrity.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-preview-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            modules/cli/build/distributions/ktchecker-0.1.0-dev.1.zip
            modules/cli/build/distributions/ktchecker-0.1.0-dev.1.tar
            build/ci-evidence/distribution-archives.json
            build/ci-evidence/package-report.json
            build/ci-evidence/distribution.cdx.json
            build/ci-evidence/NOTICE.dependency-report.txt
            build/ci-evidence/distribution-upload-review.json
            build/ci-evidence/distribution-upload-review.cdx.json
            build/ci-evidence/NOTICE.distribution-upload-review.txt
          if-no-files-found: error
          retention-days: 14
