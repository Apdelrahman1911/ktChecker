name: Planning evidence and registry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning-integrity:
    name: Planning integrity (${{ matrix.os }})
    # Provisional Windows headroom; POSIX bounds and required checks are unchanged.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-24.04
            python_timeout_seconds: 480
            job_timeout_minutes: 10
          - os: windows-2025
            python_timeout_seconds: 1200
            job_timeout_minutes: 25
          - os: macos-15
            python_timeout_seconds: 480
            job_timeout_minutes: 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out reviewed revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up validation runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test validation failure paths
        # Preserve the full scripts discovery root; the report is not rule coverage.
        run: >-
          python scripts/ci/run_python_checks.py --start-directory scripts
          --output build/ci-evidence/python/python-checks.json
          --junit build/ci-evidence/python/python-checks.xml
          --host "${{ matrix.os }}" --require-ci-context --timeout "${{ matrix.python_timeout_seconds }}"
      - name: Validate rule metadata and generated indexes
        run: python scripts/validate_plan.py
      - name: Install hash-locked planning schema dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-plan.txt
      - name: Validate synthetic application contracts and rejected states
        run: python scripts/validate_contract_examples.py docs/protocol.md
      - name: Check committed patch whitespace
        env:
          KT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          KT_PUSH_BASE: ${{ github.event.before }}
        run: python scripts/check_whitespace.py
      - name: Retain sanitized Python diagnostics even when validation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planning-python-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Never upload the neighboring raw console, protocol or checkpoint files.
          path: |
            build/ci-evidence/python/python-checks.json
            build/ci-evidence/python/python-checks.xml
          if-no-files-found: error
          retention-days: 14
